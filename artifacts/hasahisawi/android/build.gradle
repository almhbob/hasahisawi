// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
        classpath 'com.google.gms:google-services:4.4.1'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Fix: newer AGP requires all library modules to declare compileSdk.
// Patches any subproject that omits it (e.g. expo-firebase-core 6.0.0).
subprojects {
  afterEvaluate { project ->
    if (project.hasProperty("android")) {
      def android = project.extensions.findByName("android")
      if (android != null) {
        try {
          if (!android.hasProperty("compileSdk") || android.compileSdk == null) {
            android.compileSdk = 35
          }
        } catch (Exception ignored) {}
        try {
          if (android.compileSdkVersion == null) {
            android.compileSdkVersion 35
          }
        } catch (Exception ignored) {}
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
