name: Release — APK + AAB + Web PWA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v6.3.2)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'
    branches:
      - master

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ─── 0. Resolve version from app.json or input/tag ─────────────────────────
  setup:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VER=$(node -e "process.stdout.write('v'+require('./app.json').expo.version)")
            echo "version=$VER" >> $GITHUB_OUTPUT
          fi
      - run: echo "Building release ${{ steps.ver.outputs.version }}"

  # ─── 1. Build Android APK ───────────────────────────────────────────────────
  build-apk:
    name: Build APK
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      apk-path: ${{ steps.find.outputs.path }}
    env:
      RELEASE_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK (local)
        run: |
          eas build --platform android --profile preview --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://hasahisawi-api-asim-abdulrahman-mohammed.vercel.app
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyC0o8hr3Dp0hgqKovIDUM0PSCbqgBABvx8
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: hasahisawi.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: hasahisawi
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: hasahisawi.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "133656291161"
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:133656291161:android:7d0a88a80d3be1af418e48
          EXPO_PUBLIC_DISABLE_OTP: "false"

      - id: find
        name: Locate APK
        run: |
          path=$(find . -name "*.apk" | head -1)
          cp "$path" hasahisawi-${{ env.RELEASE_VERSION }}.apk
          echo "path=hasahisawi-${{ env.RELEASE_VERSION }}.apk" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.find.outputs.path }}

  # ─── 2. Build Android AAB ───────────────────────────────────────────────────
  build-aab:
    name: Build AAB
    needs: setup
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build AAB (local)
        run: |
          eas build --platform android --profile production --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://hasahisawi-api-asim-abdulrahman-mohammed.vercel.app
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyC0o8hr3Dp0hgqKovIDUM0PSCbqgBABvx8
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: hasahisawi.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: hasahisawi
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: hasahisawi.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "133656291161"
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:133656291161:android:7d0a88a80d3be1af418e48
          EXPO_PUBLIC_DISABLE_OTP: "false"

      - id: find
        name: Locate AAB
        run: |
          path=$(find . -name "*.aab" | head -1)
          cp "$path" hasahisawi-${{ env.RELEASE_VERSION }}.aab
          echo "path=hasahisawi-${{ env.RELEASE_VERSION }}.aab" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: ${{ steps.find.outputs.path }}

  # ─── 3. Build & Deploy Web PWA → GitHub Pages ───────────────────────────────
  build-web:
    name: Build Web PWA
    needs: setup
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      RELEASE_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Export web
        run: pnpm exec expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://hasahisawi-api-asim-abdulrahman-mohammed.vercel.app
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyC0o8hr3Dp0hgqKovIDUM0PSCbqgBABvx8
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: hasahisawi.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: hasahisawi
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: hasahisawi.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "133656291161"
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:133656291161:android:7d0a88a80d3be1af418e48
          EXPO_PUBLIC_DISABLE_OTP: "false"

      - name: Add PWA assets
        run: |
          cp -r public/splash dist/splash 2>/dev/null || true
          cp public/sw.js dist/sw.js 2>/dev/null || true
          cp public/manifest.json dist/manifest.json 2>/dev/null || true
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: pages
        uses: actions/deploy-pages@v4

      - name: Print URL
        run: echo "Web PWA live at ${{ steps.pages.outputs.page_url }}"

  # ─── 4. Create GitHub Release with APK + AAB ────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [setup, build-apk, build-aab, build-web]
    env:
      RELEASE_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - uses: actions/download-artifact@v4
        with:
          name: aab

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: "حصاحيصاوي ${{ env.RELEASE_VERSION }}"
          body: |
            ## حصاحيصاوي — ${{ env.RELEASE_VERSION }} (versionCode ${{ env.RELEASE_VERSION }})

            | المنصة | النسخة | الاستخدام |
            |--------|--------|---------|
            | **Android** | APK ↓ | تثبيت مباشر — فعّل "مصادر غير معروفة" |
            | **Android** | AAB ↓ | رفع على Google Play Store |
            | **iPhone / iPad** | PWA | افتح في Safari ← ↑ ← "إضافة للشاشة الرئيسية" |

            ### رابط iPhone / iPad
            **https://almhbob.github.io/hasahisawi/**

            ### ميزات ${{ env.RELEASE_VERSION }}
            - ✅ إصلاح QR ربط الهاتف بالكمبيوتر (تسجيل الشاشات + إصلاح confirm route)
            - ✅ إصلاح أعضاء Firebase في لوح التحكم (health + sync routes)
            - ✅ إجبار المستخدمين الجدد على تحديد الجنس (Google + كل الحسابات)
            - ✅ قسم وكالات السفر والسياحة
            - ✅ قسم التهنئة الفاخر (6 أنماط ملكية + مشاركة + نشر)
            - ✅ إضافة 80+ مسار API ناقص لجميع أقسام التطبيق
            - ✅ إصلاح أخطاء runtime حرجة (getAuthUser + Clipboard + greeting_likes)
            - ✅ إشعارات Push مع نغمات مخصصة لكل قسم
          files: |
            hasahisawi-${{ env.RELEASE_VERSION }}.apk
            hasahisawi-${{ env.RELEASE_VERSION }}.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
