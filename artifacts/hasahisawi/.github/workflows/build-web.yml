name: Build & Deploy Web PWA

on:
  push:
    branches: [master, main, claude/define-app-requirements-638Qf]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'app.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-web:
    name: Export Web PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export static web build
        run: pnpm exec expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://hasahisawi-api-asim-abdulrahman-mohammed.vercel.app
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyC0o8hr3Dp0hgqKovIDUM0PSCbqgBABvx8
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: hasahisawi.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: hasahisawi
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: hasahisawi.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "133656291661"
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:133656291161:android:7d0a88a80d3be1af418e48

      - name: Add 404 redirect for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Create downloadable ZIP
        run: |
          VERSION=$(node -e "process.stdout.write(require('./app.json').expo.version)")
          cd dist && zip -r ../hasahisawi-web-pwa.zip . && cd ..
          echo "WEB_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasahisawi-web-pwa-v${{ env.WEB_VERSION }}
          path: hasahisawi-web-pwa.zip
          retention-days: 30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: ''
          commit_message: 'deploy: web PWA v${{ env.WEB_VERSION }} [auto]'
