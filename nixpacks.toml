providers = []

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["corepack enable && corepack prepare pnpm@10 --activate && pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["node artifacts/api-server/build.mjs"]

[start]
cmd = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
