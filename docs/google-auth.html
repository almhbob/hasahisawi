<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>الدخول بحساب Google — حصاحيصاوي</title>
<style>
  :root { --bg:#F0F1E9; --card:#FFFFFF; --ink:#173F5F; --muted:#5E6B78; --accent:#1F5C8A; --ok:#2EAD6B; --err:#C0392B; --line:#E2E4DA; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family: "Segoe UI", Tahoma, "Noto Kufi Arabic", sans-serif; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:400px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:28px 22px; text-align:center; box-shadow:0 10px 30px rgba(23,63,95,.08); }
  .logo { height:110px; width:auto; object-fit:contain; }
  h1 { font-size:20px; margin:14px 0 6px; }
  p { color:var(--muted); font-size:14px; line-height:1.8; margin:0 0 18px; }
  button, a.btn { display:flex; width:100%; align-items:center; justify-content:center; gap:10px; border:1px solid var(--line); background:#fff; color:#1f1f1f; border-radius:14px; padding:14px; font-size:16px; font-weight:600; cursor:pointer; text-decoration:none; font-family:inherit; }
  button:disabled { opacity:.6; cursor:default; }
  a.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; margin-top:10px; }
  .status { margin-top:16px; font-size:14px; min-height:22px; }
  .status.err { color:var(--err); }
  .status.ok { color:var(--ok); }
  .spinner { width:18px; height:18px; border:2px solid #cfd6dd; border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .hidden { display:none !important; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/google-auth-logo.png" alt="" onerror="this.style.display='none'" />
    <h1>الدخول بحساب Google</h1>
    <p>اختر حسابك في Google، وسنعيدك إلى تطبيق حصاحيصاوي تلقائياً.</p>
    <button id="go" type="button">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      <span>المتابعة بحساب Google</span>
    </button>
    <a id="back" class="btn primary hidden" href="#">العودة إلى التطبيق</a>
    <div id="status" class="status"></div>
  </main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(function () {
  var API = "https://api-server-gilt-ten.vercel.app";
  var params = new URLSearchParams(location.search);
  var ret = params.get("return") || "hasahisawi://auth-callback";
  // لا نعيد التوكن إلا إلى مخطط التطبيق نفسه (يمنع تسريبه إلى موقع آخر)
  if (!/^(hasahisawi|exp\+hasahisawi|exp):\/\//i.test(ret)) ret = "hasahisawi://auth-callback";

  var btn = document.getElementById("go");
  var back = document.getElementById("back");
  var statusEl = document.getElementById("status");
  function setStatus(msg, cls, spin) {
    statusEl.className = "status " + (cls || "");
    statusEl.innerHTML = spin ? '<span style="display:inline-flex;gap:8px;align-items:center"><span class="spinner"></span>' + msg + '</span>' : msg;
  }
  function returnToApp(qs) {
    var url = ret + (ret.indexOf("?") >= 0 ? "&" : "?") + qs;
    back.href = url; back.classList.remove("hidden");
    location.href = url;
  }

  firebase.initializeApp({
    apiKey: "AIzaSyC0o8hr3Dp0hgqKovIDUM0PSCbqgBABvx8",
    authDomain: "hasahisawi.firebaseapp.com",
    projectId: "hasahisawi",
  });
  var auth = firebase.auth();
  auth.languageCode = "ar";
  var provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });

  var busy = false;
  function finish(user) {
    setStatus("جارٍ تسجيل الدخول…", "", true);
    return user.getIdToken(true).then(function (idToken) {
      return fetch(API + "/api/auth/firebase-exchange", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idToken: idToken, name: user.displayName || undefined }),
      });
    }).then(function (r) {
      return r.json().then(function (d) { if (!r.ok || !d.token) throw new Error(d.error || "تعذّر إكمال الدخول"); return d; });
    }).then(function (d) {
      setStatus("تم الدخول بنجاح ✓ — جارٍ العودة للتطبيق", "ok");
      auth.signOut().catch(function () {});
      returnToApp("token=" + encodeURIComponent(d.token));
    });
  }
  function fail(e) {
    busy = false; btn.disabled = false;
    var code = (e && e.code) || "";
    if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") { setStatus("أُلغيت العملية. اضغط الزر للمحاولة مجدداً.", "err"); return; }
    setStatus((e && e.message) ? "تعذّر الدخول: " + e.message : "تعذّر الدخول، حاول مجدداً.", "err");
  }

  btn.addEventListener("click", function () {
    if (busy) return; busy = true; btn.disabled = true;
    setStatus("افتح حسابك في Google…", "", true);
    auth.signInWithPopup(provider).then(function (c) { return finish(c.user); }).catch(function (e) {
      var code = (e && e.code) || "";
      if (code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment") {
        return auth.signInWithRedirect(provider);
      }
      fail(e);
    });
  });

  // عائد من signInWithRedirect
  auth.getRedirectResult().then(function (c) { if (c && c.user) { busy = true; btn.disabled = true; return finish(c.user); } }).catch(fail);

  if (params.get("cancel") === "1") returnToApp("cancel=1");
})();
</script>
</body>
</html>
