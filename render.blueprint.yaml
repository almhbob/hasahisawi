services:
  - type: web
    name: hasahisawi
    runtime: node
    region: ohio
    plan: starter
    branch: master
    rootDir: .
    buildCommand: npm install -g pnpm && pnpm install --filter @workspace/api-server... --ignore-scripts && cd artifacts/api-server && npm install firebase-admin@^13.4.0 --no-save --no-package-lock && node build.mjs
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/readyz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hasahisawi-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: '*'
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CLOUDINARY_URL
        sync: false

databases:
  - name: hasahisawi-db
    databaseName: hasahisawi
    user: hasahisawi
    region: ohio
    plan: free
