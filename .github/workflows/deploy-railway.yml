name: Deploy to Railway

on:
  push:
    branches: [master, main]
    paths:
      - 'artifacts/api-server/**'
      - 'lib/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-railway.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force redeploy even if no changes'
        required: false
        default: 'false'

concurrency:
  group: railway-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy API to Railway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service hasahisawi-api --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        working-directory: artifacts/api-server

      - name: Wait for deployment and health check
        run: |
          echo "⏳ Waiting 45s for Railway to build and start..."
          sleep 45
          echo "🏥 Checking health..."
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf --max-time 15 https://hasahisawi-production.up.railway.app/api/healthz 2>/dev/null || echo "")
            if [ -n "$STATUS" ]; then
              echo "✅ Railway API is live: $STATUS"
              exit 0
            fi
            echo "⏳ Attempt $i/5 — waiting 15s..."
            sleep 15
          done
          echo "⚠️  Health check timed out but deployment may still be starting"
          exit 0

      - name: Notify success
        if: success()
        run: |
          echo "🚀 Railway deployment completed!"
          echo "📡 API URL: https://hasahisawi-production.up.railway.app"
          echo "🏥 Health: https://hasahisawi-production.up.railway.app/api/healthz"
