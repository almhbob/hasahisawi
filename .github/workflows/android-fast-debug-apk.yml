name: Hasahisawi Standalone Test APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.android-debug-trigger'
      - '.github/workflows/android-fast-debug-apk.yml'
      - 'artifacts/hasahisawi/package.json'
      - 'artifacts/hasahisawi/app.json'
      - 'artifacts/hasahisawi/app/**'
      - 'artifacts/hasahisawi/lib/**'
      - 'artifacts/hasahisawi/components/**'
      - 'artifacts/hasahisawi/scripts/**'
      - 'artifacts/hasahisawi/android/**'
  pull_request:
    branches: [master, main]
    paths:
      - '.android-debug-trigger'
      - '.github/workflows/android-fast-debug-apk.yml'
      - 'artifacts/hasahisawi/package.json'
      - 'artifacts/hasahisawi/app.json'
      - 'artifacts/hasahisawi/app/**'
      - 'artifacts/hasahisawi/lib/**'
      - 'artifacts/hasahisawi/components/**'
      - 'artifacts/hasahisawi/scripts/**'
      - 'artifacts/hasahisawi/android/**'

permissions:
  contents: read

jobs:
  standalone-apk:
    name: Build standalone APK with embedded JS
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Add swap space
        run: |
          set +e
          SWAPFILE=/mnt/hasahisawi-standalone-swapfile
          sudo swapoff "$SWAPFILE" 2>/dev/null || true
          sudo rm -f "$SWAPFILE"
          sudo fallocate -l 4G "$SWAPFILE" 2>/dev/null || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=4096 status=none
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          free -h

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Read app version
        id: app
        run: |
          VERSION=$(node -e "console.log(require('./artifacts/hasahisawi/app.json').expo.version)")
          CODE=$(node -e "console.log(require('./artifacts/hasahisawi/app.json').expo.android.versionCode)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Apply app patches
        working-directory: artifacts/hasahisawi
        run: |
          node scripts/apply-latest-sections.mjs || true
          node scripts/fix-social-image-items-duplicates.mjs || true
          node scripts/fix-org-join-id-upload.mjs || true
          node scripts/apply-driver-inbox-lite.mjs || true
          node scripts/fix-transport-driver-duplicates.mjs || true
          node scripts/patch-travel-agency-workspace.mjs || true
          node scripts/patch-home-services-ui.mjs || true
          node scripts/fix-social-image-items-duplicates.mjs || true

      - name: Prepare Android standalone build
        run: |
          mkdir -p release-artifacts artifacts/hasahisawi/android/app
          echo "sdk.dir=$ANDROID_HOME" > artifacts/hasahisawi/android/local.properties
          NDK_VER=$(ls "$ANDROID_HOME/ndk/" | sort -V | tail -1)
          if [ -z "$NDK_VER" ]; then echo "No NDK found" && exit 1; fi
          PROPS=artifacts/hasahisawi/android/gradle.properties
          {
            echo ""
            echo "ndkVersion=$NDK_VER"
            echo "reactNativeArchitectures=arm64-v8a"
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError"
            echo "org.gradle.parallel=false"
            echo "org.gradle.workers.max=1"
            echo "org.gradle.caching=true"
            echo "org.gradle.configuration-cache=false"
            echo "android.enableMinifyInReleaseBuilds=false"
            echo "android.enableShrinkResourcesInReleaseBuilds=false"
          } >> "$PROPS"

      - name: Patch Android native compatibility
        run: |
          EXPO_CAM_ROOT=$(node -e "const path=require('path'); const pkg=require.resolve('expo-camera/package.json',{paths:['artifacts/hasahisawi/node_modules','.']}); console.log(path.dirname(pkg));")
          STUB_DIR="$EXPO_CAM_ROOT/android/src/main/java/expo/modules/interfaces/barcodescanner"
          mkdir -p "$STUB_DIR"
          cat > "$STUB_DIR/BarCodeScannerResult.kt" <<'KOTLIN'
          package expo.modules.interfaces.barcodescanner
          class BarCodeScannerResult(
            val type: Int,
            private val _value: String?,
            private val _raw: String?,
            var cornerPoints: MutableList<Int>,
            var referenceImageHeight: Int,
            var referenceImageWidth: Int,
          ) {
            val value: String get() = _value ?: ""
            val raw: String get() = _raw ?: ""
            val boundingBox: BoundingBox
              get() {
                if (cornerPoints.size < 8) return BoundingBox(0, 0, 0, 0)
                val xs = cornerPoints.indices.filter { it % 2 == 0 }.map { cornerPoints[it] }
                val ys = cornerPoints.indices.filter { it % 2 != 0 }.map { cornerPoints[it] }
                val minX = xs.min()
                val minY = ys.min()
                return BoundingBox(minX, minY, xs.max() - minX, ys.max() - minY)
              }
            data class BoundingBox(val x: Int, val y: Int, val width: Int, val height: Int)
          }
          KOTLIN

          while IFS= read -r FIREBASE_BUILD; do
            sed -i "s/classifier = 'sources'/archiveClassifier = 'sources'/g" "$FIREBASE_BUILD" || true
            sed -i 's/classifier = "sources"/archiveClassifier = "sources"/g' "$FIREBASE_BUILD" || true
            sed -i "s/classifier 'sources'/archiveClassifier.set('sources')/g" "$FIREBASE_BUILD" || true
            sed -i 's/classifier "sources"/archiveClassifier.set("sources")/g' "$FIREBASE_BUILD" || true
            SRC="$(dirname "$FIREBASE_BUILD")/src/main/java/expo/modules/firebase/core"
            if [ -d "$SRC" ]; then
              cat > "$SRC/FirebaseCorePackage.java" <<'JAVA_EOF'
          package expo.modules.firebase.core;
          import expo.modules.core.BasePackage;
          public class FirebaseCorePackage extends BasePackage {}
          JAVA_EOF
              cat > "$SRC/FirebaseCoreModule.java" <<'JAVA_EOF'
          package expo.modules.firebase.core;
          import android.content.Context;
          public class FirebaseCoreModule {
            public FirebaseCoreModule(Context context) {}
            public String getName() { return "ExpoFirebaseCore"; }
          }
          JAVA_EOF
            fi
          done < <(find node_modules artifacts/hasahisawi/node_modules -path "*/expo-firebase-core/android/build.gradle" 2>/dev/null)

      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v \
            -keystore artifacts/hasahisawi/android/app/release.keystore \
            -storepass hasahisawi-test-pass \
            -alias hasahisawi \
            -keypass hasahisawi-test-pass \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Hasahisawi Test,O=Hasahisawi,L=Hasahisawi,S=Gezira,C=SD"
          {
            echo "storePassword=hasahisawi-test-pass"
            echo "keyAlias=hasahisawi"
            echo "keyPassword=hasahisawi-test-pass"
          } >> artifacts/hasahisawi/android/gradle.properties

      - name: Build standalone release APK
        working-directory: artifacts/hasahisawi/android
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/release-artifacts/standalone-apk-build.log"

      - name: Verify embedded JS bundle exists
        run: |
          APK=$(find artifacts/hasahisawi/android/app/build/outputs/apk -type f -name '*release*.apk' | sort | tail -1 || true)
          if [ -z "$APK" ]; then
            echo "No release APK file produced"
            find artifacts/hasahisawi/android/app/build/outputs -maxdepth 6 -type f | sort || true
            exit 1
          fi
          unzip -l "$APK" | tee release-artifacts/apk-contents.txt
          unzip -l "$APK" | grep -E 'assets/index\.android\.bundle|assets/index\.bundle|assets/.+\.bundle' >/dev/null
          VERSION='${{ steps.app.outputs.version }}'
          CODE='${{ steps.app.outputs.code }}'
          cp "$APK" "release-artifacts/hasahisawi-standalone-test-v${VERSION}-build${CODE}.apk"
          APK_SIZE=$(stat -c%s "release-artifacts/hasahisawi-standalone-test-v${VERSION}-build${CODE}.apk")
          echo "APK size: $APK_SIZE"
          if [ "$APK_SIZE" -lt 1000000 ]; then
            echo "APK size is too small"
            exit 1
          fi
          ls -lh release-artifacts

      - name: Upload standalone test APK
        uses: actions/upload-artifact@v4
        with:
          name: hasahisawi-standalone-test-apk
          path: |
            release-artifacts/*.apk
            release-artifacts/*-build.log
            release-artifacts/apk-contents.txt
          if-no-files-found: error
          retention-days: 30
