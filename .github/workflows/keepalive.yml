name: Keep API Server Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Railway API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Railway Production API
        run: |
          echo "Pinging Hasahisawi API..."
          STATUS=$(curl -sf --max-time 20 https://hasahisawi-production.up.railway.app/api/healthz | head -c 100 || echo "unreachable")
          echo "Status: $STATUS"
