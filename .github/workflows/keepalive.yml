name: Keep API Server Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Railway API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Railway Production API
        run: |
          echo "🏥 Pinging Hasahisawi Railway API..."
          STATUS=$(curl -sf --max-time 20 https://hasahisawi-production.up.railway.app/api/healthz | head -c 100)
          echo "✅ Railway API: $STATUS"
        continue-on-error: true

      - name: Ping secondary endpoints
        run: |
          curl -sf --max-time 10 https://hasahisawi-production.up.railway.app/api/prayer-times > /dev/null && echo "✅ prayer-times OK"
          curl -sf --max-time 10 https://hasahisawi-production.up.railway.app/api/posts > /dev/null && echo "✅ posts OK"
        continue-on-error: true
