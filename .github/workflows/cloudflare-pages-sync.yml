name: Cloudflare Pages Sync

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cloudflare-pages-sync.yml'
      - '.web-deploy-trigger'
      - '.web-release-trigger'
      - 'artifacts/hasahisawi/**'
      - 'scripts/prepare-vercel-web.mjs'
      - 'scripts/web-vercel.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches: [master, main]
    paths:
      - '.github/workflows/cloudflare-pages-sync.yml'
      - '.web-deploy-trigger'
      - '.web-release-trigger'
      - 'artifacts/hasahisawi/**'
      - 'scripts/prepare-vercel-web.mjs'
      - 'scripts/web-vercel.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: write

concurrency:
  group: cloudflare-pages-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-cloudflare:
    name: Build and sync Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'master' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare web environment
        run: |
          node <<'NODE'
          const fs = require('fs');
          const easJsonPath = 'artifacts/hasahisawi/eas.json';
          const eas = fs.existsSync(easJsonPath) ? JSON.parse(fs.readFileSync(easJsonPath, 'utf8')) : {};
          const env = eas.build?.production?.env || eas.build?.preview?.env || {};
          const fallback = {
            EXPO_PUBLIC_API_URL: 'https://api-server-gilt-ten.vercel.app',
            EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: 'hasahisawi.firebaseapp.com',
            EXPO_PUBLIC_FIREBASE_PROJECT_ID: 'hasahisawi',
            EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: 'hasahisawi.firebasestorage.app',
            EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '133656291161',
            EXPO_PUBLIC_FIREBASE_APP_ID: '1:133656291161:web:7d0a88a80d3be1af418e48'
          };
          const merged = { ...fallback, ...env };
          fs.writeFileSync('artifacts/hasahisawi/.env', Object.entries(merged).map(([k, v]) => `${k}=${v}`).join('\n') + '\n');
          console.log(`Prepared ${Object.keys(merged).length} web env values`);
          NODE

      - name: Apply runtime patches
        working-directory: artifacts/hasahisawi
        run: |
          node scripts/apply-latest-sections.mjs || true
          node scripts/fix-org-join-id-upload.mjs || true
          node scripts/apply-driver-inbox-lite.mjs || true
          node scripts/patch-transport-notification-routing.mjs || true
          node scripts/apply-women-label-cleanup.mjs || true
          node scripts/apply-social-multi-images.mjs || true
          node scripts/fix-social-image-items-duplicates.mjs || true
          node scripts/patch-travel-agency-workspace.mjs || true
          node scripts/patch-home-services-ui.mjs || true

      - name: Build Cloudflare root export
        run: |
          rm -rf artifacts/hasahisawi/dist cf-dist
          node <<'NODE'
          const fs = require('fs');
          const appJsonPath = 'artifacts/hasahisawi/app.json';
          const app = JSON.parse(fs.readFileSync(appJsonPath, 'utf8'));
          app.expo.experiments = app.expo.experiments || {};
          app.expo.experiments.baseUrl = '';
          app.expo.web = app.expo.web || {};
          app.expo.web.scope = '/';
          app.expo.web.startUrl = '/';
          app.expo.plugins = ['expo-router', 'expo-font', 'expo-web-browser'];
          fs.writeFileSync(appJsonPath, JSON.stringify(app, null, 2) + '\n');
          console.log(`Cloudflare export for v${app.expo.version}`);
          NODE
          pnpm --dir artifacts/hasahisawi exec expo export --platform web --clear
          mkdir -p cf-dist
          cp -r artifacts/hasahisawi/dist/. cf-dist/
          cp -r artifacts/hasahisawi/public/splash cf-dist/splash 2>/dev/null || true
          cp artifacts/hasahisawi/public/sw.js cf-dist/sw.js 2>/dev/null || true
          cp artifacts/hasahisawi/public/manifest.json cf-dist/manifest.json 2>/dev/null || true
          cp artifacts/hasahisawi/public/icon.png cf-dist/icon.png 2>/dev/null || true
          cp artifacts/hasahisawi/public/favicon.png cf-dist/favicon.png 2>/dev/null || true
          cp cf-dist/index.html cf-dist/404.html
          echo '/hasahisawi/* /:splat 302' > cf-dist/_redirects
          echo '/hasahisawi / 302' >> cf-dist/_redirects
          echo '/* /index.html 200' >> cf-dist/_redirects
          cp scripts/web-vercel.json cf-dist/vercel.json
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('artifacts/hasahisawi/app.json', 'utf8'));
          fs.writeFileSync('cf-dist/deploy-version.json', JSON.stringify({
            app: 'hasahisawi',
            version: app.expo.version,
            androidVersionCode: app.expo.android.versionCode,
            iosBuildNumber: app.expo.ios.buildNumber,
            commit: process.env.GITHUB_SHA,
            deployedAt: new Date().toISOString(),
            target: 'cloudflare-pages',
            source: 'cloudflare-pages-sync'
          }, null, 2) + '\n');
          NODE

      - name: Verify Cloudflare output
        run: |
          test -f cf-dist/index.html
          test -f cf-dist/404.html
          test -f cf-dist/_redirects
          test -f cf-dist/vercel.json
          test -f cf-dist/deploy-version.json
          node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('cf-dist/deploy-version.json','utf8')); if(v.target!=='cloudflare-pages') process.exit(1); console.log(v);"
          du -sh cf-dist

      - name: Upload Cloudflare preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-cf-dist
          path: cf-dist/**
          if-no-files-found: error
          retention-days: 7

      - name: Commit Cloudflare static output
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git checkout -- artifacts/hasahisawi/app.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f cf-dist/
          if git diff --cached --quiet; then
            echo "No cf-dist changes"
          else
            # نسخة البناء جانباً؛ عند تعارض النشر مع نشر آخر نعيد البناء فوق أحدث master بدل rebase يتعارض
            rm -rf /tmp/cf-dist-build && cp -r cf-dist /tmp/cf-dist-build
            git commit -q -m "deploy: cloudflare pages latest [auto]"
            for attempt in 1 2 3 4 5; do
              git push origin HEAD:master && break
              echo "Push attempt $attempt failed; rebuilding the commit on top of the latest master"
              sleep $((attempt * 5))
              git fetch -q origin master
              git reset -q --hard origin/master
              cp -r /tmp/cf-dist-build/. cf-dist/
              git add -f cf-dist/
              git diff --cached --quiet && { echo "Already up to date"; break; }
              git commit -q -m "deploy: cloudflare pages latest [auto]"
            done
          fi

      - name: Deploy web app to Vercel (sawihasa.digital)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_RTCz9oaxsbHBdJHrSJNyJr5q
          VERCEL_PROJECT_ID: prj_3ILAiSvcf301EBwFrl8Y46Am45Av
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not set — skipped Vercel web deploy"
            exit 0
          fi
          # Vercel drops directories named node_modules (where Expo puts icon/Cairo fonts).
          node scripts/prepare-vercel-web.mjs cf-dist vercel-dist
          cd vercel-dist
          VERCEL="npx --yes vercel@54.20.1"
          ok=1
          $VERCEL pull --yes --environment=production --token="$VERCEL_TOKEN" \
            && $VERCEL build --prod --token="$VERCEL_TOKEN" \
            && $VERCEL deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tee /tmp/vercel-url.txt \
            || ok=0
          if [ "$ok" = 1 ]; then
            echo "✅ Web app deployed → https://hasahisawi-web.vercel.app"
          else
            echo "::warning title=Vercel web deploy failed::See the step log; GitHub Pages and the API are unaffected."
          fi

      - name: Deploy with Wrangler when configured
        if: ${{ github.event_name != 'pull_request' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # المفتاح المحفوظ قد يحمل سطراً جديداً أو مسافة من النسخ واللصق فيرفضه Cloudflare (Headers.append)
          # النسخ من هاتف عربي قد يضيف علامات اتجاه خفية؛ مفاتيح Cloudflare حروف لاتينية وأرقام و _ - فقط
          # إن لُصق نص صفحة Cloudflare كاملاً (المفتاح + أمر curl) نستخرج المفتاح cfut_… منه
          _cf_tok="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | LC_ALL=C grep -oE 'cfut_[A-Za-z0-9_-]+' | head -n1)"
          if [ -z "$_cf_tok" ]; then
            _cf_tok="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed 's/.*Bearer[[:space:]]*//' | LC_ALL=C tr -cd 'A-Za-z0-9_-')"
          fi
          CLOUDFLARE_API_TOKEN="$_cf_tok"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | LC_ALL=C tr -cd 'A-Fa-f0-9')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          # تشخيص دون كشف القيم: الطول وصلاحية المفتاح
          echo "token length: ${#CLOUDFLARE_API_TOKEN} (40, or 53 for new cfut_ tokens) · account id length: ${#CLOUDFLARE_ACCOUNT_ID} (expected 32)"
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify \
              | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);console.log("token verify:",j.success?"VALID status="+(j.result&&j.result.status):"INVALID "+JSON.stringify(j.errors))}catch{console.log("token verify: no response")}})' || true
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare API secrets are not configured. cf-dist was committed for Cloudflare Git integration."
            exit 0
          fi
          if ! npx wrangler@4 pages deploy cf-dist --project-name=hasahisawi --branch=master; then
            echo "::warning title=Cloudflare deploy skipped::Cloudflare rejected the API token (renew CLOUDFLARE_API_TOKEN with 'Cloudflare Pages: Edit' permission). GitHub Pages deploy is unaffected."
          fi
