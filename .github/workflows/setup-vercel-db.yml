name: Setup DATABASE_URL on Vercel

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.setup-db-trigger'

jobs:
  setup:
    name: Extract Railway DB URL → Set on Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          MISSING=0
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "❌ RAILWAY_TOKEN secret is NOT set in this repository"
            echo "   Go to: https://github.com/almhbob/hasahisawi/settings/secrets/actions"
            echo "   Add secret: RAILWAY_TOKEN = your Railway token from https://railway.app/account/tokens"
            MISSING=1
          else
            echo "✅ RAILWAY_TOKEN is set (length: ${#RAILWAY_TOKEN})"
          fi
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "❌ VERCEL_TOKEN secret is NOT set"
            MISSING=1
          else
            echo "✅ VERCEL_TOKEN is set (length: ${#VERCEL_TOKEN})"
          fi
          [ $MISSING -eq 1 ] && exit 1 || true

      - name: Extract DATABASE_URL from Railway
        id: get_db
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -e

          echo "🔍 Querying Railway for projects..."
          PROJECTS_RAW=$(curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ projects { edges { node { id name environments { edges { node { id name } } } services { edges { node { id name } } } } } } }"}')

          echo "Raw response (first 500 chars): ${PROJECTS_RAW:0:500}"

          # Check for auth errors
          HAS_ERROR=$(echo "$PROJECTS_RAW" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          errs=d.get('errors',[])
          if errs: print('ERROR: ' + errs[0].get('message','unknown'))
          elif not d.get('data'): print('ERROR: no data returned')
          else: print('OK')
          " 2>/dev/null || echo "ERROR: json parse failed")

          echo "API check: $HAS_ERROR"

          if echo "$HAS_ERROR" | grep -qi "error"; then
            echo ""
            echo "❌ Railway API auth failed. Possible causes:"
            echo "   1. RAILWAY_TOKEN expired → generate new at https://railway.app/account/tokens"
            echo "   2. Token has no permission to read projects"
            exit 1
          fi

          echo ""
          echo "🔍 Scanning all project/environment/service variable combinations..."

          DB_URL=$(echo "$PROJECTS_RAW" | python3 - <<'PYEOF'
          import json, sys, os, urllib.request, urllib.error

          data = json.loads(sys.stdin.read())
          token = os.environ["RAILWAY_TOKEN"]

          def gql(query, variables=None):
              payload = {"query": query}
              if variables:
                  payload["variables"] = variables
              req = urllib.request.Request(
                  "https://backboard.railway.app/graphql/v2",
                  data=json.dumps(payload).encode(),
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read())

          # Safe getter that handles null data values
          def safe_edges(d, *keys):
              cur = d
              for k in keys:
                  if not isinstance(cur, dict): return []
                  cur = cur.get(k) or {}
              return cur.get("edges", []) if isinstance(cur, dict) else []

          projects = safe_edges(data, "data", "projects")
          print(f"Found {len(projects)} projects", file=sys.stderr)

          for p_edge in projects:
              proj = p_edge.get("node", {}) or {}
              proj_id = proj.get("id", "")
              proj_name = proj.get("name", "?")
              envs = safe_edges(proj, "environments")
              svcs = safe_edges(proj, "services")
              print(f"  Project: {proj_name} ({len(envs)} envs, {len(svcs)} services)", file=sys.stderr)

              for env_edge in envs:
                  env = env_edge.get("node", {}) or {}
                  env_id = env.get("id", "")
                  env_name = env.get("name", "?")

                  for svc_edge in svcs:
                      svc = svc_edge.get("node", {}) or {}
                      svc_id = svc.get("id", "")
                      svc_name = svc.get("name", "?")

                      for query_name in ["variables", "variablesForServiceDeployment"]:
                          try:
                              q = (f"query V($p:String!,$e:String!,$s:String!)"
                                   f"{{ {query_name}(projectId:$p,environmentId:$e,serviceId:$s) }}")
                              r = gql(q, {"p": proj_id, "e": env_id, "s": svc_id})
                              vd = (r.get("data") or {}).get(query_name) or {}
                              if isinstance(vd, str):
                                  try: vd = json.loads(vd)
                                  except: vd = {}
                              db = vd.get("DATABASE_URL", "") if isinstance(vd, dict) else ""
                              if db and ("postgres" in db.lower() or "shortline" in db.lower()):
                                  print(f"  ✅ FOUND in {proj_name}/{env_name}/{svc_name} via {query_name}", file=sys.stderr)
                                  print(db)
                                  sys.exit(0)
                          except Exception as ex:
                              print(f"  skip {proj_name}/{env_name}/{svc_name}/{query_name}: {type(ex).__name__}", file=sys.stderr)

          print("Not found in any service variables", file=sys.stderr)
          PYEOF
          )

          # Fallback: Railway CLI
          if [ -z "$DB_URL" ]; then
            echo ""
            echo "⚠️  Not found via GraphQL — trying Railway CLI..."
            npm install -g @railway/cli@latest --quiet 2>/dev/null

            PROJ_IDS=$(echo "$PROJECTS_RAW" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for p in ((d.get('data') or {}).get('projects') or {}).get('edges',[]):
              pid=( p.get('node') or {}).get('id','')
              if pid: print(pid)
          " 2>/dev/null)

            for PID in $PROJ_IDS; do
              railway link --project "$PID" 2>/dev/null || true
              DB_URL=$(railway variables --json 2>/dev/null | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
              url=d.get('DATABASE_URL','')
              if url and ('postgres' in url.lower() or 'shortline' in url.lower()):
                  print(url)
          except: pass
          " 2>/dev/null)
              [ -n "$DB_URL" ] && echo "✅ Found via CLI (project $PID)" && break
            done
          fi

          if [ -z "$DB_URL" ]; then
            echo ""
            echo "❌ DATABASE_URL not found in any Railway project."
            echo ""
            echo "Manual fallback — add DATABASE_URL to Vercel directly:"
            echo "  https://vercel.com/almhbob2026-1311s-projects/api-server/settings/environment-variables"
            exit 1
          fi

          MASKED=$(echo "$DB_URL" | python3 -c "
          import sys,urllib.parse as p
          u=sys.stdin.read().strip()
          try:
              pr=p.urlparse(u)
              print(f'{pr.scheme}://{pr.username}:***@{pr.hostname}:{pr.port}{pr.path}')
          except: print('found (url masked)')
          " 2>/dev/null || echo "found")
          echo "✅ DATABASE_URL: $MASKED"
          echo "DB_URL=$DB_URL" >> "$GITHUB_OUTPUT"

      - name: Set DATABASE_URL on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DB_URL="${{ steps.get_db.outputs.DB_URL }}"
          [ -z "$DB_URL" ] && echo "No DB_URL — skipping" && exit 1

          DB_JSON=$(python3 -c "import json,sys; print(json.dumps(sys.argv[1]))" "$DB_URL")

          RESULT=$(curl -s -X POST \
            "https://api.vercel.com/v10/projects/prj_7NqIloolEKoPpF5JKr3KVWjapKVw/env?teamId=team_RTCz9oaxsbHBdJHrSJNyJr5q&upsert=true" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "[{\"key\":\"DATABASE_URL\",\"value\":$DB_JSON,\"type\":\"encrypted\",\"target\":[\"production\",\"preview\"]}]")

          echo "$RESULT" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if isinstance(d,list):
              for e in d: print(f'✅ Vercel env set: {e.get(\"key\",\"?\")}')
          elif 'error' in d:
              print(f'❌ {d[\"error\"]}'); exit(1)
          else: print(str(d)[:300])
          "

      - name: Redeploy Vercel API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "🚀 Triggering Vercel redeploy..."

          LATEST_UID=$(curl -s \
            "https://api.vercel.com/v6/deployments?projectId=prj_7NqIloolEKoPpF5JKr3KVWjapKVw&teamId=team_RTCz9oaxsbHBdJHrSJNyJr5q&limit=1&target=production&state=READY" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          deps=d.get('deployments',[])
          print(deps[0]['uid'] if deps else '')
          " 2>/dev/null)

          if [ -n "$LATEST_UID" ]; then
            R=$(curl -s -X POST \
              "https://api.vercel.com/v13/deployments?teamId=team_RTCz9oaxsbHBdJHrSJNyJr5q&forceNew=1" \
              -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
              -d "{\"deploymentId\":\"$LATEST_UID\",\"name\":\"api-server\",\"target\":\"production\"}")
            NEW=$(echo "$R" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('url','') or d.get('error',{}).get('message','?'))" 2>/dev/null)
            echo "Redeploy URL: $NEW"
          else
            echo "No existing deployment — next api-server push will trigger deploy"
          fi

      - name: Verify API health
        run: |
          echo "⏳ Waiting 45s..."
          sleep 45
          for i in 1 2 3 4 5 6 7 8; do
            S=$(curl -s --max-time 20 "https://api-server-gilt-ten.vercel.app/api/healthz" 2>/dev/null | \
              python3 -c "import json,sys; print(json.load(sys.stdin).get('status','?'))" 2>/dev/null || echo "...")
            echo "[$i/8] healthz → $S"
            [ "$S" = "ok" ] && echo "✅ API healthy!" && exit 0
            [ $i -lt 8 ] && sleep 15
          done
          echo "⚠️  Check manually: https://api-server-gilt-ten.vercel.app/api/healthz"
