name: Setup DATABASE_URL on Vercel

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.setup-db-trigger'

jobs:
  setup:
    name: Extract Railway DB URL → Set on Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract DATABASE_URL from Railway
        id: get_db
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -e

          echo "🔍 Step 1: List Railway projects..."
          PROJECTS=$(curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ projects { edges { node { id name environments { edges { node { id name } } } services { edges { node { id name } } } } } } }"}')

          echo "$PROJECTS" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for p in d.get('data',{}).get('projects',{}).get('edges',[]):
              n=p['node']
              envs=[e['node']['name'] for e in n.get('environments',{}).get('edges',[])]
              svcs=[s['node']['name'] for s in n.get('services',{}).get('edges',[])]
              print(f\"  {n['name']} (id={n['id']}) envs={envs} services={svcs}\")
          " 2>/dev/null || true

          echo ""
          echo "🔍 Step 2: Scan variables for each project/env/service combination..."

          DB_URL=$(echo "$PROJECTS" | python3 - <<'PYEOF'
          import json, sys, os, urllib.request, urllib.error

          data = json.load(sys.stdin)
          token = os.environ["RAILWAY_TOKEN"]

          def gql(query, variables=None):
              payload = {"query": query}
              if variables:
                  payload["variables"] = variables
              req = urllib.request.Request(
                  "https://backboard.railway.app/graphql/v2",
                  data=json.dumps(payload).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json"
                  }
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read())

          projects = data.get("data", {}).get("projects", {}).get("edges", [])
          for p_edge in projects:
              proj = p_edge["node"]
              proj_id = proj["id"]
              proj_name = proj["name"]
              envs = proj.get("environments", {}).get("edges", [])
              svcs = proj.get("services", {}).get("edges", [])

              for env_edge in envs:
                  env_id = env_edge["node"]["id"]
                  env_name = env_edge["node"]["name"]

                  for svc_edge in svcs:
                      svc_id = svc_edge["node"]["id"]
                      svc_name = svc_edge["node"]["name"]

                      try:
                          r = gql(
                              "query Vars($p:String!,$e:String!,$s:String!){"
                              "variables(projectId:$p,environmentId:$e,serviceId:$s)}",
                              {"p": proj_id, "e": env_id, "s": svc_id}
                          )
                          vd = r.get("data", {}).get("variables", {}) or {}
                          if isinstance(vd, str):
                              try: vd = json.loads(vd)
                              except: vd = {}
                          db = vd.get("DATABASE_URL", "")
                          if db and ("postgres" in db.lower() or "shortline" in db.lower()):
                              print(f"FOUND in {proj_name}/{env_name}/{svc_name}: {db}", file=sys.stderr)
                              print(db)
                              sys.exit(0)
                      except Exception as ex:
                          print(f"  skip {proj_name}/{env_name}/{svc_name}: {ex}", file=sys.stderr)

          # If not found in service vars, try variablesForServiceDeployment
          print("Trying variablesForServiceDeployment...", file=sys.stderr)
          for p_edge in projects:
              proj = p_edge["node"]
              envs = proj.get("environments", {}).get("edges", [])
              svcs = proj.get("services", {}).get("edges", [])
              for env_edge in envs:
                  env_id = env_edge["node"]["id"]
                  for svc_edge in svcs:
                      svc_id = svc_edge["node"]["id"]
                      try:
                          r = gql(
                              "query VarsD($p:String!,$e:String!,$s:String!){"
                              "variablesForServiceDeployment(projectId:$p,environmentId:$e,serviceId:$s)}",
                              {"p": proj["id"], "e": env_id, "s": svc_id}
                          )
                          vd = r.get("data", {}).get("variablesForServiceDeployment", {}) or {}
                          if isinstance(vd, str):
                              try: vd = json.loads(vd)
                              except: vd = {}
                          db = vd.get("DATABASE_URL", "")
                          if db and ("postgres" in db.lower() or "shortline" in db.lower()):
                              print(f"FOUND (deploy) in {proj['name']}: {db}", file=sys.stderr)
                              print(db)
                              sys.exit(0)
                      except Exception as ex:
                          pass
          PYEOF
          )

          if [ -z "$DB_URL" ]; then
            echo ""
            echo "⚠️  DATABASE_URL not found via GraphQL, trying Railway CLI..."

            npm install -g @railway/cli@latest --quiet 2>/dev/null || true

            # Use Railway CLI to get variables (works with RAILWAY_TOKEN env var)
            # List all projects first
            PROJ_LIST=$(railway list 2>/dev/null | grep -v "^$" | head -20 || echo "")
            echo "Railway projects: $PROJ_LIST"

            # Try linking to first project that has postgres
            PROJ_IDS=$(echo "$PROJECTS" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for p in d.get('data',{}).get('projects',{}).get('edges',[]):
              print(p['node']['id'])
          " 2>/dev/null)

            for PID in $PROJ_IDS; do
              railway link --project "$PID" 2>/dev/null || true
              CLI_VARS=$(railway variables --json 2>/dev/null || echo "{}")
              DB_URL=$(echo "$CLI_VARS" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
              url=d.get('DATABASE_URL','')
              if url and 'postgres' in url.lower():
                  print(url)
          except: pass
          " 2>/dev/null)
              if [ -n "$DB_URL" ]; then
                echo "✅ Found via Railway CLI (project $PID)"
                break
              fi
            done
          fi

          if [ -z "$DB_URL" ]; then
            echo "❌ DATABASE_URL not found. Please set it manually:"
            echo "   1. Open https://railway.app → project → PostgreSQL service → Variables"
            echo "   2. Copy DATABASE_URL"
            echo "   3. Open https://vercel.com → api-server project → Settings → Env Vars"
            echo "   4. Add DATABASE_URL as production variable"
            exit 1
          fi

          # Mask password in logs
          MASKED=$(echo "$DB_URL" | python3 -c "
          import sys,urllib.parse as p
          u=sys.stdin.read().strip()
          try:
              parsed=p.urlparse(u)
              safe=parsed._replace(netloc=f'{parsed.username}:***@{parsed.hostname}:{parsed.port}')
              print(p.urlunparse(safe))
          except: print('postgresql://***@***')
          " 2>/dev/null || echo "found")

          echo "✅ DATABASE_URL found: $MASKED"
          echo "DB_URL=$DB_URL" >> "$GITHUB_OUTPUT"

      - name: Set DATABASE_URL on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DB_URL="${{ steps.get_db.outputs.DB_URL }}"
          if [ -z "$DB_URL" ]; then
            echo "No DB_URL to set — skipping"
            exit 1
          fi

          # Encode the URL safely as JSON
          DB_JSON=$(python3 -c "import json,sys; print(json.dumps(sys.argv[1]))" "$DB_URL")

          RESULT=$(curl -s -X POST \
            "https://api.vercel.com/v10/projects/prj_7NqIloolEKoPpF5JKr3KVWjapKVw/env?teamId=team_RTCz9oaxsbHBdJHrSJNyJr5q&upsert=true" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "[{\"key\":\"DATABASE_URL\",\"value\":$DB_JSON,\"type\":\"encrypted\",\"target\":[\"production\",\"preview\"]}]")

          echo "$RESULT" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
              if isinstance(d,list):
                  for e in d: print(f'✅ Vercel env set: {e.get(\"key\",\"?\")}')
              elif 'error' in d:
                  print(f'❌ Vercel error: {d[\"error\"]}'); exit(1)
              else:
                  print(str(d)[:300])
          except Exception as ex:
              print(f'Parse error: {ex}'); print(sys.stdin.read()[:300])
          "

      - name: Redeploy Vercel API with new env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "🚀 Redeploying Vercel API..."

          # Find latest production deployment and redeploy it
          LATEST_UID=$(curl -s \
            "https://api.vercel.com/v6/deployments?projectId=prj_7NqIloolEKoPpF5JKr3KVWjapKVw&teamId=team_RTCz9oaxsbHBdJHrSJNyJr5q&limit=1&target=production&state=READY" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          deps=d.get('deployments',[])
          print(deps[0]['uid'] if deps else '')
          " 2>/dev/null)

          if [ -n "$LATEST_UID" ]; then
            echo "Redeploying $LATEST_UID..."
            REDEP=$(curl -s -X POST \
              "https://api.vercel.com/v13/deployments?teamId=team_RTCz9oaxsbHBdJHrSJNyJr5q&forceNew=1" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"deploymentId\":\"$LATEST_UID\",\"name\":\"api-server\",\"target\":\"production\"}")
            NEW_URL=$(echo "$REDEP" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(d.get('url','') or d.get('error',{}).get('message','?'))
          " 2>/dev/null)
            echo "New deployment URL: $NEW_URL"
          else
            echo "No existing deployment found — next push to master will deploy"
          fi

      - name: Verify API is alive
        run: |
          echo "⏳ Waiting 45s for deployment..."
          sleep 45
          for i in 1 2 3 4 5 6 7 8; do
            STATUS=$(curl -s --max-time 20 \
              "https://api-server-gilt-ten.vercel.app/api/healthz" 2>/dev/null | \
              python3 -c "import json,sys; print(json.load(sys.stdin).get('status','?'))" 2>/dev/null || echo "...")
            echo "[$i/8] → $STATUS"
            [ "$STATUS" = "ok" ] && echo "✅ API healthy!" && exit 0
            sleep 15
          done
          echo "⚠️ API not confirmed healthy yet — check manually"
