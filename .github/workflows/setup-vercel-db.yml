name: Setup DATABASE_URL on Vercel

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Railway project name containing the PostgreSQL DB (leave empty to search all)'
        required: false
        default: ''

jobs:
  setup:
    name: Extract Railway DB URL → Set on Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Extract DATABASE_URL from Railway
        id: get_db_url
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -e
          echo "🔍 Listing Railway projects..."
          railway list 2>&1 || true

          # Try to get variables using Railway CLI
          # First, find the hasahisawi project
          PROJECT_JSON=$(curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ projects { edges { node { id name environments { edges { node { id name } } } services { edges { node { id name } } } } } } }"}')

          echo "Projects found:"
          echo "$PROJECT_JSON" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if 'errors' in d:
              print('API ERROR:', json.dumps(d['errors']))
          for p in d.get('data',{}).get('projects',{}).get('edges',[]):
              n=p['node']
              envs=[e['node']['name'] for e in n.get('environments',{}).get('edges',[])]
              svcs=[s['node']['name'] for s in n.get('services',{}).get('edges',[])]
              print(f\"  {n['id']} | {n['name']} | envs: {envs} | services: {svcs}\")
          "

          # Extract project/env/service IDs for the hasahisawi project
          PROJ_DATA=$(echo "$PROJECT_JSON" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for p in d.get('data',{}).get('projects',{}).get('edges',[]):
              n=p['node']
              name=n['name'].lower()
              # Match by name hint or take first project with postgres service
              for s in n.get('services',{}).get('edges',[]):
                  sname=s['node']['name'].lower()
                  if 'postgres' in sname or 'pg' in sname or 'db' in sname or 'database' in sname:
                      envs=n.get('environments',{}).get('edges',[])
                      env_id=envs[0]['node']['id'] if envs else ''
                      print(f\"{n['id']}|{env_id}|{s['node']['id']}\")
                      exit()
          # fallback: first project, first env, first service
          edges=d.get('data',{}).get('projects',{}).get('edges',[])
          if edges:
              n=edges[0]['node']
              envs=n.get('environments',{}).get('edges',[])
              svcs=n.get('services',{}).get('edges',[])
              env_id=envs[0]['node']['id'] if envs else ''
              svc_id=svcs[0]['node']['id'] if svcs else ''
              print(f\"{n['id']}|{env_id}|{svc_id}\")
          ")

          PROJECT_ID=$(echo "$PROJ_DATA" | cut -d'|' -f1)
          ENV_ID=$(echo "$PROJ_DATA" | cut -d'|' -f2)
          SVC_ID=$(echo "$PROJ_DATA" | cut -d'|' -f3)
          echo "Using project=$PROJECT_ID env=$ENV_ID service=$SVC_ID"

          # Query resolved variable values using the variables() query
          DB_URL=$(curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"{ variables(projectId: \\\"$PROJECT_ID\\\", environmentId: \\\"$ENV_ID\\\", serviceId: \\\"$SVC_ID\\\") }\"}" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if 'errors' in d:
              print('VARS ERROR:', json.dumps(d['errors']), file=sys.stderr)
          vars_data=d.get('data',{}).get('variables',{})
          if isinstance(vars_data, dict):
              url=vars_data.get('DATABASE_URL','')
              if url: print(url)
          elif isinstance(vars_data, str):
              try:
                  vd=json.loads(vars_data)
                  url=vd.get('DATABASE_URL','')
                  if url: print(url)
              except: pass
          " 2>&1)

          # If still not found, try scanning ALL services in ALL projects with variables query
          if [ -z "$DB_URL" ] || echo "$DB_URL" | grep -qi "error"; then
            echo "⚠️  Direct variables query failed, scanning all project/env combinations..."
            DB_URL=$(echo "$PROJECT_JSON" | python3 - <<'PYEOF'
          import json,sys,subprocess,os
          d=json.load(open('/dev/stdin'))
          token=os.environ.get('RAILWAY_TOKEN','')
          import urllib.request

          def gql(query):
              req=urllib.request.Request('https://backboard.railway.app/graphql/v2',
                  data=json.dumps({'query':query}).encode(),
                  headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=15) as r:
                  return json.loads(r.read())

          for p in d.get('data',{}).get('projects',{}).get('edges',[]):
              proj=p['node']
              envs=proj.get('environments',{}).get('edges',[])
              svcs=proj.get('services',{}).get('edges',[])
              for env in envs:
                  for svc in svcs:
                      try:
                          r=gql(f'{{ variables(projectId: "{proj["id"]}", environmentId: "{env["node"]["id"]}", serviceId: "{svc["node"]["id"]}") }}')
                          vd=r.get('data',{}).get('variables',{}) or {}
                          if isinstance(vd,str):
                              try: vd=json.loads(vd)
                              except: vd={}
                          url=vd.get('DATABASE_URL','')
                          if url and ('postgres' in url.lower() or 'shortline' in url.lower()):
                              print(url)
                              exit()
                      except Exception as e:
                          pass
          PYEOF
          )
          fi

          if [ -z "$DB_URL" ] || echo "$DB_URL" | grep -qi "error\|ERROR"; then
            echo "❌ DATABASE_URL not found via Railway API"
            echo ""
            echo "=== Manual setup instructions ==="
            echo "1. Open https://railway.app → your project"
            echo "2. Open the PostgreSQL service → Variables tab"
            echo "3. Copy DATABASE_URL value"
            echo "4. Open https://vercel.com → api-server project → Settings → Environment Variables"
            echo "5. Add DATABASE_URL as a production variable"
            exit 1
          fi

          echo "✅ Found DATABASE_URL (length: ${#DB_URL})"
          # Mask the password in logs
          MASKED=$(echo "$DB_URL" | python3 -c "
          import sys,urllib.parse
          url=sys.stdin.read().strip()
          try:
              p=urllib.parse.urlparse(url)
              print(f'{p.scheme}://{p.username}:***@{p.hostname}:{p.port}{p.path}')
          except: print('postgresql://***')
          ")
          echo "URL (masked): $MASKED"
          echo "DB_URL=$DB_URL" >> $GITHUB_OUTPUT

      - name: Set DATABASE_URL on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DB_URL: ${{ steps.get_db_url.outputs.DB_URL }}
        run: |
          set -e
          echo "🔧 Setting DATABASE_URL on Vercel project..."

          RESULT=$(curl -s -X POST \
            "https://api.vercel.com/v10/projects/prj_7NqIloolEKoPpF5JKr3KVWjapKVw/env?teamId=team_RTCz9oaxsbHBdJHrSJNyJr5q&upsert=true" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data-raw "[{\"key\":\"DATABASE_URL\",\"value\":$(echo "$DB_URL" | python3 -c \"import json,sys; print(json.dumps(sys.stdin.read().strip()))\"),\"type\":\"encrypted\",\"target\":[\"production\",\"preview\"]}]")

          echo "$RESULT" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if isinstance(d,list):
              for e in d: print(f'✅ Set env: {e.get(\"key\",\"?\")}')
          elif isinstance(d,dict) and 'error' in d:
              print(f'❌ Error: {d[\"error\"]}')
              exit(1)
          else:
              print(str(d)[:200])
          "

      - name: Trigger Vercel redeploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "🚀 Triggering new Vercel deployment..."

          # Redeploy latest deployment of the project
          LATEST=$(curl -s \
            "https://api.vercel.com/v6/deployments?projectId=prj_7NqIloolEKoPpF5JKr3KVWjapKVw&teamId=team_RTCz9oaxsbHBdJHrSJNyJr5q&limit=1&target=production" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); deps=d.get('deployments',[]); print(deps[0]['uid'] if deps else '')")

          if [ -n "$LATEST" ]; then
            REDEPLOY=$(curl -s -X POST \
              "https://api.vercel.com/v13/deployments?teamId=team_RTCz9oaxsbHBdJHrSJNyJr5q&forceNew=1" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"deploymentId\":\"$LATEST\",\"name\":\"api-server\",\"target\":\"production\"}")
            NEW_URL=$(echo "$REDEPLOY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('url','') or d.get('error',''))" 2>/dev/null || echo "?")
            echo "New deployment: $NEW_URL"
          else
            echo "No existing deployment found to redeploy — push to master will trigger next deploy"
          fi

      - name: Wait and verify API
        run: |
          echo "⏳ Waiting 45s for deployment to settle..."
          sleep 45

          for i in 1 2 3 4 5 6; do
            OUT=$(curl -s --max-time 20 "https://api-server-gilt-ten.vercel.app/api/healthz" 2>/dev/null || echo '{}')
            STATUS=$(echo "$OUT" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','?'))" 2>/dev/null || echo "error")
            echo "[$i/6] healthz → $STATUS"
            if [ "$STATUS" = "ok" ]; then
              echo "✅ API is healthy at https://api-server-gilt-ten.vercel.app"
              break
            fi
            [ $i -lt 6 ] && sleep 15
          done
