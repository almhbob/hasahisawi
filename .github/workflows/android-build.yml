name: Android Build & Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Read app version
        id: ver
        run: |
          VERSION=$(node -e "console.log(require('./artifacts/hasahisawi/app.json').expo.version)")
          CODE=$(node -e "console.log(require('./artifacts/hasahisawi/app.json').expo.android.versionCode)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE"       >> $GITHUB_OUTPUT
          echo "Building v$VERSION (versionCode: $CODE)"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Create .env file
        working-directory: artifacts/hasahisawi
        run: |
          cat > .env <<'EOF'
EXPO_PUBLIC_FIREBASE_API_KEY=AIzaSyDD1dx3OnC4ztLkoajtk7-T1EP6r0zgV68
EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=hasahisawi.firebaseapp.com
EXPO_PUBLIC_FIREBASE_PROJECT_ID=hasahisawi
EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=hasahisawi.firebasestorage.app
EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=133656291161
EXPO_PUBLIC_FIREBASE_APP_ID=1:133656291161:android:c91938f519fa219d418e48
EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID=G-8NDWWB1735
EXPO_PUBLIC_API_URL=https://hasahisawi-api-asim-abdulrahman-mohammed.vercel.app
EOF

      - name: Expo prebuild (Android)
        working-directory: artifacts/hasahisawi
        env:
          EXPO_NO_GIT_STATUS: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyDD1dx3OnC4ztLkoajtk7-T1EP6r0zgV68
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: hasahisawi.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: hasahisawi
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: hasahisawi.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '133656291161'
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:133656291161:android:c91938f519fa219d418e48
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: G-8NDWWB1735
          EXPO_PUBLIC_API_URL: https://hasahisawi-api-asim-abdulrahman-mohammed.vercel.app
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > artifacts/hasahisawi/android/app/hasahisawi-release.keystore

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('artifacts/hasahisawi/android/**/*.gradle*', 'artifacts/hasahisawi/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build release APK + AAB
        working-directory: artifacts/hasahisawi/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/artifacts/hasahisawi/android/app/hasahisawi-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          echo "=== Build outputs ==="
          find . -name "*.apk" -o -name "*.aab" 2>/dev/null | grep -v intermediate

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: hasahisawi-v${{ steps.ver.outputs.version }}-code${{ steps.ver.outputs.code }}-aab
          path: artifacts/hasahisawi/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: hasahisawi-v${{ steps.ver.outputs.version }}-code${{ steps.ver.outputs.code }}-apk
          path: artifacts/hasahisawi/android/app/build/outputs/apk/release/
          retention-days: 30
          if-no-files-found: warn

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f artifacts/hasahisawi/android/app/hasahisawi-release.keystore
          rm -f artifacts/hasahisawi/.env
