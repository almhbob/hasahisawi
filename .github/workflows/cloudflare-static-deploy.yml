name: Cloudflare Static Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-static-deploy
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Cloudflare static output
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Verify cf-dist output
        run: |
          test -f cf-dist/index.html
          test -f cf-dist/_redirects
          ls -la cf-dist
          echo "cf-dist is ready for Cloudflare Pages."
          echo "Target URL: https://hasahisawi.pages.dev/"
