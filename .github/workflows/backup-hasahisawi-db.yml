name: Backup Hasahisawi Database (encrypted)

# نسخة احتياطية مشفّرة لقاعدة بيانات المستخدمين.
# المستودع عام، لذلك لا يُرفع أي ملف إلا بعد تشفيره بـ GPG بعبارة سر من GitHub Secrets.
#
# الأسرار المطلوبة (Settings → Secrets and variables → Actions):
#   RAILWAY_TOKEN       (موجود مسبقاً) يُبنى منه رابط قاعدة الإنتاج تلقائياً — نفس قاعدة الخادم على Vercel
#   DATABASE_URL        (اختياري) يتجاوز الرابط التلقائي إن وُضع
#   BACKUP_PASSPHRASE   عبارة سر طويلة لتشفير النسخة — احفظها في مكان آمن خارج GitHub
#
# فك التشفير والاسترجاع:
#   gpg --batch --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
#       -d hasahisawi-YYYYMMDD-HHMM.dump.gpg > hasahisawi.dump
#   pg_restore --no-owner --no-acl -d "$TARGET_DATABASE_URL" hasahisawi.dump

on:
  workflow_dispatch:
  schedule:
    # يومياً 03:17 بتوقيت السعودية (00:17 UTC)
    - cron: '17 0 * * *'

permissions:
  contents: read

env:
  RW_PROJECT: e82d86db-7b87-4446-9968-f60934f618b4      # lively-mindfulness (قاعدة الإنتاج)
  RW_ENV: f708e9d6-bbfa-4562-9a58-3e41977b40ed
  RW_POSTGRES: 984dd90a-b068-4089-a823-859d353c02ca

concurrency:
  group: hasahisawi-db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump → GPG → artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve DATABASE_URL
        id: db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          URL="${DATABASE_URL:-}"
          if [ -z "$URL" ] && [ -n "${RAILWAY_TOKEN:-}" ]; then
            Q=$(printf '{"query":"query { variables(projectId: \\"%s\\", environmentId: \\"%s\\", serviceId: \\"%s\\") }"}' "$RW_PROJECT" "$RW_ENV" "$RW_POSTGRES")
            fetch() { curl -sS -X POST https://backboard.railway.com/graphql/v2 -H "Content-Type: application/json" "$@" -d "$Q"; }
            RAW=$(fetch -H "Authorization: Bearer $RAILWAY_TOKEN")
            printf '%s' "$RAW" | grep -q '"variables"' || RAW=$(fetch -H "Project-Access-Token: $RAILWAY_TOKEN")
            URL=$(printf '%s' "$RAW" | python3 -c '
          import json, sys, urllib.parse as u
          v = ((json.load(sys.stdin).get("data") or {}).get("variables") or {})
          host, port, pw = v.get("RAILWAY_TCP_PROXY_DOMAIN"), v.get("RAILWAY_TCP_PROXY_PORT"), v.get("POSTGRES_PASSWORD") or v.get("PGPASSWORD")
          if host and port and pw:
              print("postgresql://%s:%s@%s:%s/%s?sslmode=require" % (u.quote(v.get("POSTGRES_USER") or v.get("PGUSER") or "postgres", safe=""), u.quote(pw, safe=""), host, port, v.get("POSTGRES_DB") or v.get("PGDATABASE") or "railway"))
          ' || true)
            if [ -z "$URL" ]; then
              # تشخيص آمن: رسائل الخطأ وأسماء المتغيرات فقط، دون أي قيمة سرية
              printf '%s' "$RAW" | python3 -c '
          import json, sys
          try: d = json.load(sys.stdin)
          except Exception: print("::warning::Railway API returned a non-JSON response (network or token problem)"); sys.exit(0)
          for e in (d.get("errors") or []): print("::warning::Railway API error: " + str(e.get("message"))[:200])
          v = ((d.get("data") or {}).get("variables") or {})
          if v: print("::warning::Token works; variable names present: " + ", ".join(sorted(k for k in v if k.startswith(("RAILWAY_TCP","POSTGRES","PG","DATABASE")))))
          if v and not v.get("RAILWAY_TCP_PROXY_DOMAIN"): print("::warning::No public TCP proxy on the Postgres service — enable it in Railway (Postgres > Settings > Networking > TCP Proxy) or set the DATABASE_URL secret")
          ' || true
            fi
          fi
          [ -n "$URL" ] && echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Check secrets
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=0
          [ -n "$DATABASE_URL" ] || { echo "::error::No database URL (RAILWAY_TOKEN could not resolve it and DATABASE_URL is not set)"; missing=1; }
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret is not set — refusing to upload an unencrypted dump from a public repository"
            missing=1
          elif [ "${#BACKUP_PASSPHRASE}" -lt 20 ]; then
            echo "::error::BACKUP_PASSPHRASE must be at least 20 characters"
            missing=1
          fi
          exit $missing

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          PGCONNECT_TIMEOUT: '20'
        run: |
          set -euo pipefail
          umask 077
          STAMP=$(date -u +%Y%m%d-%H%M)
          OUT="hasahisawi-${STAMP}.dump.gpg"

          # تأكيد أن القاعدة تعمل وتحتوي على المستخدمين قبل أخذ النسخة
          USERS=$(/usr/lib/postgresql/17/bin/psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM users" || echo "ERR")
          if [ "$USERS" = "ERR" ]; then
            echo "::error::Database is unreachable — nothing was backed up"
            exit 1
          fi
          echo "users rows: $USERS"

          # الملف الخام لا يُكتب على القرص — يُشفَّر مباشرة من الـ pipe
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl \
            | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
                  --passphrase-fd 3 -o "$OUT" 3<<<"$BACKUP_PASSPHRASE"

          # تحقق أن الملف المشفّر سليم ويُفك ويقرأه pg_restore
          gpg --batch --pinentry-mode loopback --passphrase-fd 3 -d "$OUT" 3<<<"$BACKUP_PASSPHRASE" 2>/dev/null \
            | /usr/lib/postgresql/17/bin/pg_restore --list >/dev/null
          ls -lh "$OUT"
          echo "BACKUP_FILE=$OUT" >> "$GITHUB_ENV"
          echo "### ✅ Backup OK — $OUT ($USERS users)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
