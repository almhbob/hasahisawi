name: Keep-Alive — Ping Servers

on:
  schedule:
    # كل 10 دقائق — يمنع نوم Render وVercel cold-start
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping API servers
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Vercel API (new — api-server-gilt-ten)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://api-server-gilt-ten.vercel.app/api/healthz")
          echo "Vercel new → HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ Vercel API OK" || echo "⚠️ Vercel API returned $STATUS"

      - name: Ping PWA (GitHub Pages)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            "https://almhbob.github.io/hasahisawi/")
          echo "GitHub Pages → HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ GitHub Pages OK" || echo "⚠️ GitHub Pages returned $STATUS"

      - name: Ping PWA (Cloudflare Pages)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            "https://hasahisawi.pages.dev/")
          echo "Cloudflare Pages → HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ Cloudflare OK" || echo "⚠️ Cloudflare returned $STATUS"
