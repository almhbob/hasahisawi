name: Deploy API to Vercel

on:
  push:
    branches: [master, main]
    paths:
      - 'artifacts/api-server/**'
      - 'lib/**'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force redeploy'
        required: false
        default: 'false'

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: artifacts/api-server

      - name: Build for Vercel
        run: node build.mjs
        working-directory: artifacts/api-server

      - name: Deploy via Vercel CLI
        working-directory: artifacts/api-server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_0AaPNMDJ2x12u3oQH5SaiB35
          VERCEL_PROJECT_ID: prj_h3HTgJKHTAsqBt6W2r93MhgDuJGm
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN 2>&1 | tail -1)
          echo "Deployed to: $DEPLOY_URL"

      - name: Health check
        run: |
          sleep 20
          STATUS=$(curl -sf --max-time 30 \
            "https://hasahisawi-api-asim-abdulrahman-mohammed.vercel.app/api/healthz" || echo "unreachable")
          echo "Health check: $STATUS"
