name: API Health Report

# Publishes /api/readyz and /api/stats from both API hosts as annotations so the
# database, Firebase and upload status can be read without opening raw logs.
# The readiness payload contains no secrets (connection strings are never echoed).

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.health-check-trigger'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query readiness
        run: |
          cat > /tmp/summarize.py <<'PY'
          import json, sys
          raw = sys.stdin.read()
          try:
              d = json.loads(raw)
              c = d.get("details", {})
              db = c.get("database", {})
              fb = c.get("firebase", {})
              print("ready=%s | db.connected=%s db.provider=%s db.reason=%s | firebase=%s (%s) | version=%s" % (
                  d.get("ready"), db.get("connected"), db.get("provider_hint"), db.get("reason"),
                  fb.get("configured"), fb.get("reason"), d.get("version")))
          except Exception:
              print("unparseable readyz: " + raw[:200].replace("\n", " "))
          PY
          for host in api-server-gilt-ten.vercel.app hasahisawi-production.up.railway.app; do
            body=$(curl -s --max-time 30 "https://$host/api/readyz" || echo '{"error":"unreachable"}')
            stats=$(curl -s --max-time 30 "https://$host/api/stats" || echo 'unreachable')
            summary=$(printf '%s' "$body" | python3 /tmp/summarize.py || echo "summary failed")
            echo "== $host"; echo "$body"; echo "$stats"
            echo "::notice title=${host}::${summary} | stats=${stats}"
            # Login probe with a non-existent account: 401 = login path healthy, 500 = broken
            login=$(curl -s -o /tmp/login.json -w '%{http_code}' --max-time 30 -X POST "https://$host/api/auth/login" \
              -H 'Content-Type: application/json' -d '{"phone_or_email":"healthcheck-nonexistent@example.invalid","password":"x"}')
            echo "::notice title=${host} login probe::HTTP ${login} $(head -c 200 /tmp/login.json)"
            # Security probe: the public default admin PIN must never be accepted
            pinchk=$(curl -s --max-time 30 -X POST "https://$host/api/admin/validate-pin" -H 'Content-Type: application/json' -d '{"pin":"4444"}')
            echo "::notice title=${host} default-PIN probe::${pinchk}"
          done
