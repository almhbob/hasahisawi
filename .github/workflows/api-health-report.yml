name: API Health Report

# Publishes /api/readyz from both API hosts as annotations so the database,
# Firebase and upload status can be read without opening raw logs.
# The readiness payload contains no secrets (connection strings are never echoed).

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.health-check-trigger'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query readiness
        run: |
          for host in https://api-server-gilt-ten.vercel.app https://hasahisawi-production.up.railway.app; do
            body=$(curl -s --max-time 30 "$host/api/readyz" || echo '{"error":"unreachable"}')
            stats=$(curl -s --max-time 30 "$host/api/stats" || echo 'unreachable')
            echo "== $host"; echo "$body"; echo "$stats"
            summary=$(printf '%s' "$body" | python3 -c '
          import json,sys
          try:
              d=json.load(sys.stdin); c=d.get("details",{})
              db=c.get("database",{}); fb=c.get("firebase",{})
              print(f"ready={d.get(\"ready\")} | db.connected={db.get(\"connected\")} db.provider={db.get(\"provider_hint\")} db.reason={db.get(\"reason\")} | firebase={fb.get(\"configured\")} ({fb.get(\"reason\")}) | version={d.get(\"version\")}")
          except Exception as e:
              print("unparseable readyz: " + sys.stdin.read()[:200])
          ')
            echo "::notice title=$host::$summary | stats=$stats"
          done
