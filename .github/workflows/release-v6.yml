name: Hasahisawi Android APK AAB Release

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.release-trigger'
      - '.github/workflows/release-v6.yml'
      - 'artifacts/hasahisawi/package.json'
      - 'artifacts/hasahisawi/app.json'
      - 'artifacts/hasahisawi/app/**'
      - 'artifacts/hasahisawi/lib/**'
      - 'artifacts/hasahisawi/components/**'
      - 'artifacts/hasahisawi/scripts/**'
  pull_request:
    branches: [master, main]
    paths:
      - '.release-trigger'
      - '.github/workflows/release-v6.yml'
      - 'artifacts/hasahisawi/package.json'
      - 'artifacts/hasahisawi/app.json'
      - 'artifacts/hasahisawi/app/**'
      - 'artifacts/hasahisawi/lib/**'
      - 'artifacts/hasahisawi/components/**'
      - 'artifacts/hasahisawi/scripts/**'

permissions:
  contents: write

jobs:
  build-android:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Add swap space
        continue-on-error: true
        run: |
          sudo fallocate -l 4G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Read app version
        id: ver
        run: |
          VERSION=$(node -e "console.log(require('./artifacts/hasahisawi/app.json').expo.version)")
          CODE=$(node -e "console.log(require('./artifacts/hasahisawi/app.json').expo.android.versionCode)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "Building Hasahisawi v$VERSION build $CODE"

      - name: Apply app patches
        working-directory: artifacts/hasahisawi
        run: |
          node scripts/apply-latest-sections.mjs
          node scripts/apply-travel-shipping-services.mjs
          node scripts/apply-driver-inbox-lite.mjs || true
          node scripts/apply-women-label-cleanup.mjs || true
          node scripts/apply-social-multi-images.mjs || true

      - name: Prepare Android build files
        run: |
          mkdir -p release-artifacts
          echo "sdk.dir=$ANDROID_HOME" > artifacts/hasahisawi/android/local.properties
          NDK_VER=$(ls "$ANDROID_HOME/ndk/" | sort -V | tail -1)
          if [ -z "$NDK_VER" ]; then echo "No NDK found" && exit 1; fi
          PROPS=artifacts/hasahisawi/android/gradle.properties
          {
            echo ""
            echo "ndkVersion=$NDK_VER"
            echo "reactNativeArchitectures=arm64-v8a"
            echo "org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"
            echo "org.gradle.parallel=false"
            echo "org.gradle.workers.max=1"
            echo "org.gradle.caching=true"
            echo "org.gradle.configuration-cache=false"
          } >> "$PROPS"
          tail -20 "$PROPS"

      - name: Patch Android native compatibility
        run: |
          EXPO_CAM_ROOT=$(node -e "const path=require('path'); const pkg=require.resolve('expo-camera/package.json',{paths:['artifacts/hasahisawi/node_modules','.']}); console.log(path.dirname(pkg));")
          STUB_DIR="$EXPO_CAM_ROOT/android/src/main/java/expo/modules/interfaces/barcodescanner"
          mkdir -p "$STUB_DIR"
          cat > "$STUB_DIR/BarCodeScannerResult.kt" <<'KOTLIN'
          package expo.modules.interfaces.barcodescanner
          class BarCodeScannerResult(
            val type: Int,
            private val _value: String?,
            private val _raw: String?,
            var cornerPoints: MutableList<Int>,
            var referenceImageHeight: Int,
            var referenceImageWidth: Int,
          ) {
            val value: String get() = _value ?: ""
            val raw: String get() = _raw ?: ""
            val boundingBox: BoundingBox
              get() {
                if (cornerPoints.size < 8) return BoundingBox(0, 0, 0, 0)
                val xs = cornerPoints.indices.filter { it % 2 == 0 }.map { cornerPoints[it] }
                val ys = cornerPoints.indices.filter { it % 2 != 0 }.map { cornerPoints[it] }
                val minX = xs.min()
                val minY = ys.min()
                return BoundingBox(minX, minY, xs.max() - minX, ys.max() - minY)
              }
            data class BoundingBox(val x: Int, val y: Int, val width: Int, val height: Int)
          }
          KOTLIN

          while IFS= read -r FIREBASE_BUILD; do
            echo "Patching $FIREBASE_BUILD"
            sed -i "s/classifier = 'sources'/archiveClassifier = 'sources'/g" "$FIREBASE_BUILD" || true
            sed -i 's/classifier = "sources"/archiveClassifier = "sources"/g' "$FIREBASE_BUILD" || true
            sed -i "s/classifier 'sources'/archiveClassifier.set('sources')/g" "$FIREBASE_BUILD" || true
            sed -i 's/classifier "sources"/archiveClassifier.set("sources")/g' "$FIREBASE_BUILD" || true
            SRC="$(dirname "$FIREBASE_BUILD")/src/main/java/expo/modules/firebase/core"
            if [ -d "$SRC" ]; then
              cat > "$SRC/FirebaseCorePackage.java" <<'JAVA_EOF'
          package expo.modules.firebase.core;
          import expo.modules.core.BasePackage;
          public class FirebaseCorePackage extends BasePackage {}
          JAVA_EOF
              cat > "$SRC/FirebaseCoreModule.java" <<'JAVA_EOF'
          package expo.modules.firebase.core;
          import android.content.Context;
          public class FirebaseCoreModule {
            public FirebaseCoreModule(Context context) {}
            public String getName() { return "ExpoFirebaseCore"; }
          }
          JAVA_EOF
            fi
            grep -n "classifier\|archiveClassifier" "$FIREBASE_BUILD" || true
          done < <(find node_modules artifacts/hasahisawi/node_modules -path "*/expo-firebase-core/android/build.gradle" 2>/dev/null)

      - name: Create release signing key
        run: |
          KEYSTORE_DEST=artifacts/hasahisawi/android/app/release.keystore
          mkdir -p artifacts/hasahisawi/android/app
          STORE_PASSWORD="Hasahisawi2026Secure"
          KEY_ALIAS_VALUE="hasahisawi"
          KEY_PASSWORD_VALUE="Hasahisawi2026Secure"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_DEST" \
            -alias "$KEY_ALIAS_VALUE" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD_VALUE" \
            -dname "CN=Hasahisawi, OU=Mobile, O=Hasahisawi, L=Hasahisa, ST=Gezira, C=SD"
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS_VALUE"
            echo "keyPassword=$KEY_PASSWORD_VALUE"
            echo "android.injected.signing.store.file=$GITHUB_WORKSPACE/$KEYSTORE_DEST"
            echo "android.injected.signing.store.password=$STORE_PASSWORD"
            echo "android.injected.signing.key.alias=$KEY_ALIAS_VALUE"
            echo "android.injected.signing.key.password=$KEY_PASSWORD_VALUE"
          } >> artifacts/hasahisawi/android/gradle.properties
          keytool -list -v -keystore "$KEYSTORE_DEST" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS_VALUE" | grep -E 'Alias name|SHA256|Valid from' || true

      - name: Build release APK
        working-directory: artifacts/hasahisawi/android
        env:
          NODE_OPTIONS: "--max-old-space-size=3584"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/release-artifacts/apk-build.log"

      - name: Build release AAB
        working-directory: artifacts/hasahisawi/android
        env:
          NODE_OPTIONS: "--max-old-space-size=3584"
        run: |
          ./gradlew bundleRelease --no-daemon --build-cache --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/release-artifacts/aab-build.log"

      - name: Collect APK and AAB
        if: always()
        run: |
          VERSION='${{ steps.ver.outputs.version }}'
          CODE='${{ steps.ver.outputs.code }}'
          mkdir -p release-artifacts
          APK=artifacts/hasahisawi/android/app/build/outputs/apk/release/app-release.apk
          AAB=artifacts/hasahisawi/android/app/build/outputs/bundle/release/app-release.aab
          if [ -f "$APK" ]; then cp "$APK" "release-artifacts/hasahisawi-v${VERSION}-build${CODE}.apk"; fi
          if [ -f "$AAB" ]; then cp "$AAB" "release-artifacts/hasahisawi-v${VERSION}-build${CODE}.aab"; fi
          ls -lh release-artifacts || true

      - name: Upload artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasahisawi-android-v${{ steps.ver.outputs.version }}-build${{ steps.ver.outputs.code }}
          path: release-artifacts/*
          if-no-files-found: warn
          retention-days: 30

      - name: Verify real APK and AAB exist
        run: |
          APK_FILE=$(ls release-artifacts/*.apk 2>/dev/null | head -1 || true)
          AAB_FILE=$(ls release-artifacts/*.aab 2>/dev/null | head -1 || true)
          if [ -z "$APK_FILE" ] || [ -z "$AAB_FILE" ]; then
            echo "Missing APK or AAB. Current release-artifacts content:"
            ls -lah release-artifacts || true
            exit 1
          fi
          echo "APK: $APK_FILE"
          echo "AAB: $AAB_FILE"

      - name: Publish GitHub Release
        if: ${{ github.event_name != 'pull_request' && hashFiles('release-artifacts/*.apk') != '' && hashFiles('release-artifacts/*.aab') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build${{ steps.ver.outputs.code }}-android
          name: Hasahisawi v${{ steps.ver.outputs.version }} build ${{ steps.ver.outputs.code }} Android APK AAB
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
