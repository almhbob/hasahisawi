name: Hasahisawi Safe Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional release version override
        required: false
        type: string
      release_code:
        description: Optional Android versionCode override
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify prelaunch readiness
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare release metadata
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_CODE: ${{ inputs.release_code }}
          EXPO_PUBLIC_DISABLE_OTP: 'false'
        run: node scripts/prepare-mobile-store-release.mjs

      - name: Security and type checks
        run: pnpm run prelaunch:check

      - name: Web smoke export
        working-directory: artifacts/hasahisawi
        env:
          EXPO_PUBLIC_DISABLE_OTP: 'false'
        run: pnpm exec expo export --platform web

  android-preview:
    name: Build Android preview APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare release metadata
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_CODE: ${{ inputs.release_code }}
          EXPO_PUBLIC_DISABLE_OTP: 'false'
        run: node scripts/prepare-mobile-store-release.mjs

      - name: Build internal APK with EAS
        working-directory: artifacts/hasahisawi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_DISABLE_OTP: 'false'
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN secret is required for EAS builds."
            exit 1
          fi
          pnpm exec eas build --platform android --profile preview --non-interactive

  android-store:
    name: Build Android store AAB
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare release metadata
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_CODE: ${{ inputs.release_code }}
          EXPO_PUBLIC_DISABLE_OTP: 'false'
        run: node scripts/prepare-mobile-store-release.mjs

      - name: Build store AAB with EAS
        working-directory: artifacts/hasahisawi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_DISABLE_OTP: 'false'
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN secret is required for EAS builds."
            exit 1
          fi
          pnpm exec eas build --platform android --profile production --non-interactive
