name: Hasahisawi Hardening APK

on:
  workflow_dispatch:
  push:
    branches:
      - hardening/prelaunch-security-fixes
    paths:
      - artifacts/hasahisawi/**
      - .github/workflows/release-v6.yml

permissions:
  contents: read

jobs:
  local-debug-apk:
    name: Build local debug APK with branch fixes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: artifacts/hasahisawi
    env:
      EXPO_PUBLIC_DISABLE_OTP: 'false'
      EXPO_PUBLIC_API_URL: https://api-server-gilt-ten.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Drop legacy Firebase recaptcha package
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (pkg.dependencies) delete pkg.dependencies['expo-firebase-recaptcha'];
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Patch UI and social fallback
        run: node scripts/patch-home-services-ui.mjs

      - name: Build debug APK
        run: cd android && chmod +x ./gradlew && ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasahisawi-hardening-debug-apk
          path: artifacts/hasahisawi/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
