name: حصاحيصاوي v6.2.0 — Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.release-trigger'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ─── Build APK + AAB (Android) ────────────────────────────────────
  build-android:
    name: Build APK + AAB (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.ver.outputs.version }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure NDK version
        run: |
          echo "=== Pre-installed NDK versions ==="
          ls "$ANDROID_HOME/ndk/" || echo "none"
          echo "=== Pre-installed Build-tools ==="
          ls "$ANDROID_HOME/build-tools/" || echo "none"
          NDK_VER=$(ls "$ANDROID_HOME/ndk/" | sort -V | tail -1)
          if [ -z "$NDK_VER" ]; then
            echo "ERROR: No NDK found" && exit 1
          fi
          echo "Using NDK: $NDK_VER"
          echo "ndkVersion=$NDK_VER" >> artifacts/hasahisawi/android/gradle.properties
          echo "Wrote ndkVersion=$NDK_VER to gradle.properties"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Read version
        id: ver
        run: |
          VERSION=$(node -e "console.log(require('./artifacts/hasahisawi/app.json').expo.version)")
          CODE=$(node -e "console.log(require('./artifacts/hasahisawi/app.json').expo.android.versionCode)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE"       >> $GITHUB_OUTPUT
          echo "Building v$VERSION (versionCode $CODE)"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Create .env
        working-directory: artifacts/hasahisawi
        run: |
          printf '%s\n' \
            'EXPO_PUBLIC_FIREBASE_API_KEY=AIzaSyC0o8hr3Dp0hgqKovIDUM0PSCbqgBABvx8' \
            'EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=hasahisawi.firebaseapp.com' \
            'EXPO_PUBLIC_FIREBASE_PROJECT_ID=hasahisawi' \
            'EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=hasahisawi.firebasestorage.app' \
            'EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=133656291161' \
            'EXPO_PUBLIC_FIREBASE_APP_ID=1:133656291161:android:7d0a88a80d3be1af418e48' \
            'EXPO_PUBLIC_API_URL=https://hasahisawi-api-asim-abdulrahman-mohammed.vercel.app' \
            'EXPO_PUBLIC_DISABLE_OTP=true' > .env

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > artifacts/hasahisawi/android/local.properties

      - name: Setup keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_DEST=artifacts/hasahisawi/android/app/release.keystore
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_DEST"
            echo "✅ Keystore from KEYSTORE_BASE64 secret ($(wc -c < $KEYSTORE_DEST) bytes)"
          else
            echo "⚠️  KEYSTORE_BASE64 not set — build will use hardcoded signing config"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v6-${{ hashFiles('artifacts/hasahisawi/android/**/*.gradle*') }}
          restore-keys: gradle-v6-

      - name: Pre-build diagnostics
        working-directory: artifacts/hasahisawi/android
        run: |
          echo "=== ANDROID_HOME: $ANDROID_HOME ==="
          echo "=== NDK: $(ls $ANDROID_HOME/ndk/ 2>/dev/null || echo NOT FOUND) ==="
          echo "=== Build-tools: $(ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo NOT FOUND) ==="
          echo "=== Node module resolution from android/ ==="
          node --print "require.resolve('react-native/package.json')" 2>&1 || echo "FAIL: react-native not found"
          node --print "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })" 2>&1 || echo "FAIL: gradle-plugin not found"
          echo "=== Keystore: $(ls -la app/release.keystore 2>/dev/null || echo NOT FOUND) ==="
          echo "=== Gradle version ==="
          ./gradlew --version 2>&1 | tail -10

      - name: Build release APK + AAB
        working-directory: artifacts/hasahisawi/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'Hasahisawi@2026#Secure' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'hasahisawi' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'Hasahisawi@2026#Secure' }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/artifacts/hasahisawi/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Rename artifacts
        run: |
          cp artifacts/hasahisawi/android/app/build/outputs/apk/release/app-release.apk \
             hasahisawi-v${{ steps.ver.outputs.version }}.apk
          cp artifacts/hasahisawi/android/app/build/outputs/bundle/release/app-release.aab \
             hasahisawi-v${{ steps.ver.outputs.version }}.aab
          ls -lh hasahisawi-v*.apk hasahisawi-v*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: hasahisawi-v${{ steps.ver.outputs.version }}.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: hasahisawi-v${{ steps.ver.outputs.version }}.aab
          retention-days: 30

      - name: Cleanup secrets
        if: always()
        run: rm -f artifacts/hasahisawi/android/app/release.keystore artifacts/hasahisawi/.env

  # ─── Build + Deploy Web PWA → docs/ on master ───────────────────────
  deploy-web:
    name: Build + Deploy Web PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --no-frozen-lockfile

      - name: Export web
        working-directory: artifacts/hasahisawi
        run: pnpm exec expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://hasahisawi-api-asim-abdulrahman-mohammed.vercel.app
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyC0o8hr3Dp0hgqKovIDUM0PSCbqgBABvx8
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: hasahisawi.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: hasahisawi
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: hasahisawi.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '133656291161'
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:133656291161:android:7d0a88a80d3be1af418e48
          EXPO_PUBLIC_DISABLE_OTP: 'true'

      - name: Add PWA files
        working-directory: artifacts/hasahisawi
        run: |
          cp -r public/splash dist/splash 2>/dev/null || true
          cp public/sw.js dist/sw.js 2>/dev/null || true
          cp public/manifest.json dist/manifest.json 2>/dev/null || true
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Deploy to docs/ on master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git reset --hard origin/master
          rm -rf docs/
          mkdir -p docs
          cp -r artifacts/hasahisawi/dist/. docs/
          git add -f docs/
          git diff --cached --quiet && echo "No changes to deploy" || \
            git commit -m "deploy: web PWA v6.2.0 → docs/"
          git push origin master

      - run: echo "✅ PWA live at https://almhbob.github.io/hasahisawi/"

  # ─── Create GitHub Release ────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-android, deploy-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - uses: actions/download-artifact@v4
        with:
          name: aab

      - name: Create Release + Upload APK/AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-android.outputs.version }}
          name: "حصاحيصاوي v${{ needs.build-android.outputs.version }}"
          body: |
            ## حصاحيصاوي — v${{ needs.build-android.outputs.version }} (versionCode ${{ needs.build-android.outputs.code }})

            | المنصة | النسخة | الاستخدام |
            |--------|--------|---------|
            | **Android** | APK ↓ | تثبيت مباشر — فعّل "مصادر غير معروفة" |
            | **Android** | AAB ↓ | رفع على Google Play Store |
            | **iPhone / iPad** | PWA | افتح في Safari ← ↑ ← "إضافة للشاشة الرئيسية" |

            ### رابط iPhone / iPad
            **https://almhbob.github.io/hasahisawi/**

            ### ميزات v${{ needs.build-android.outputs.version }}
            - ✅ بوابة الكوادر الطبية (طبيب · معمل · صيدلية · تمريض)
            - ✅ منشئ السيرة الذاتية (4 قوالب · PDF · 5000 SDG)
            - ✅ اتحاد الطلاب داخل قسم النقابات
            - ✅ إصلاح خطأ شركاء وكالات السفر
            - ✅ دعم iOS PWA + Service Worker
            - ✅ تحسينات المصادقة والأداء
          files: |
            hasahisawi-v${{ needs.build-android.outputs.version }}.apk
            hasahisawi-v${{ needs.build-android.outputs.version }}.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
