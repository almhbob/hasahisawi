name: Hasahisawi Hardening APK

on:
  workflow_dispatch:
  push:
    branches:
      - hardening/prelaunch-security-fixes
    paths:
      - artifacts/hasahisawi/**
      - .github/workflows/release-v6.yml

permissions:
  contents: read

jobs:
  eas-preview-apk:
    name: Build EAS preview APK with branch fixes
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: artifacts/hasahisawi
    env:
      EXPO_PUBLIC_DISABLE_OTP: 'false'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Patch social screen
        run: node scripts/patch-home-services-ui.mjs

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Build preview APK on EAS
        run: eas build --platform android --profile preview --non-interactive --wait
