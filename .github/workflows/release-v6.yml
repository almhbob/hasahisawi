name: حصاحيصاوي — Release + Auto-Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.release-trigger'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ─── Build APK + AAB (Android) ────────────────────────────────────
  build-android:
    name: Build APK + AAB (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      version: ${{ steps.ver.outputs.version }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Add swap space (4 GB)
        continue-on-error: true
        run: |
          sudo fallocate -l 4G /swapfile 2>/dev/null || \
            sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "✅ Swap active: $(free -h | grep Swap)"

      - name: Configure NDK version
        run: |
          echo "=== Pre-installed NDK versions ==="
          ls "$ANDROID_HOME/ndk/" || echo "none"
          echo "=== Pre-installed Build-tools ==="
          ls "$ANDROID_HOME/build-tools/" || echo "none"
          NDK_VER=$(ls "$ANDROID_HOME/ndk/" | sort -V | tail -1)
          if [ -z "$NDK_VER" ]; then
            echo "ERROR: No NDK found" && exit 1
          fi
          echo "Using NDK: $NDK_VER"
          echo "ndkVersion=$NDK_VER" >> artifacts/hasahisawi/android/gradle.properties
          echo "Wrote ndkVersion=$NDK_VER to gradle.properties"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Read version
        id: ver
        run: |
          VERSION=$(node -e "console.log(require('./artifacts/hasahisawi/app.json').expo.version)")
          CODE=$(node -e "console.log(require('./artifacts/hasahisawi/app.json').expo.android.versionCode)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE"       >> $GITHUB_OUTPUT
          echo "Building v$VERSION (versionCode $CODE)"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Ensure latest sections are linked
        working-directory: artifacts/hasahisawi
        run: node scripts/apply-latest-sections.mjs

      - name: Verify Android native version matches app.json
        run: |
          APP_VERSION=$(node -e "console.log(require('./artifacts/hasahisawi/app.json').expo.version)")
          APP_CODE=$(node -e "console.log(require('./artifacts/hasahisawi/app.json').expo.android.versionCode)")
          GRADLE_VERSION=$(grep -E 'versionName ' artifacts/hasahisawi/android/app/build.gradle | head -1 | sed -E 's/.*versionName "([^"]+)".*/\1/')
          GRADLE_CODE=$(grep -E 'versionCode ' artifacts/hasahisawi/android/app/build.gradle | head -1 | awk '{print $2}')
          echo "app.json: $APP_VERSION / $APP_CODE"
          echo "Gradle:   $GRADLE_VERSION / $GRADLE_CODE"
          test "$APP_VERSION" = "$GRADLE_VERSION"
          test "$APP_CODE" = "$GRADLE_CODE"

      - name: Patch expo-camera — add missing BarCodeScannerResult stub
        run: |
          # expo-camera@16.0.18 references expo.modules.interfaces.barcodescanner.BarCodeScannerResult
          # which was removed when expo-barcode-scanner was deprecated in Expo SDK 52.
          # We inject a compatibility stub into expo-camera's own source tree so Kotlin can compile it.
          EXPO_CAM_ROOT=$(node -e "
            const path = require('path');
            const pkg = require.resolve('expo-camera/package.json', {paths:['artifacts/hasahisawi/node_modules']});
            console.log(path.dirname(pkg));
          ")
          STUB_DIR="$EXPO_CAM_ROOT/android/src/main/java/expo/modules/interfaces/barcodescanner"
          mkdir -p "$STUB_DIR"
          cat > "$STUB_DIR/BarCodeScannerResult.kt" <<'KOTLIN'
          package expo.modules.interfaces.barcodescanner

          class BarCodeScannerResult(
              val type: Int,
              private val _value: String?,
              private val _raw: String?,
              var cornerPoints: MutableList<Int>,
              var referenceImageHeight: Int,
              var referenceImageWidth: Int,
          ) {
              val value: String get() = _value ?: ""
              val raw: String get() = _raw ?: ""

              val boundingBox: BoundingBox
                  get() {
                      if (cornerPoints.size < 8) return BoundingBox(0, 0, 0, 0)
                      val xs = cornerPoints.indices.filter { it % 2 == 0 }.map { cornerPoints[it] }
                      val ys = cornerPoints.indices.filter { it % 2 != 0 }.map { cornerPoints[it] }
                      val minX = xs.min()
                      val minY = ys.min()
                      return BoundingBox(minX, minY, xs.max() - minX, ys.max() - minY)
                  }

              data class BoundingBox(val x: Int, val y: Int, val width: Int, val height: Int)
          }
          KOTLIN
          echo "✅ BarCodeScannerResult stub created at $STUB_DIR"

      - name: Patch expo-firebase-core — replace incompatible Java sources
        run: |
          # expo-firebase-core@6.0.0 references ExportedModule removed from expo-modules-core in SDK 52+.
          # Replace with no-op stubs — Firebase init is via google-services.json, not this native module.
          while IFS= read -r FIREBASE_BUILD; do
            SRC="$(dirname "$FIREBASE_BUILD")/src/main/java/expo/modules/firebase/core"
            if [ -d "$SRC" ]; then
              cat > "$SRC/FirebaseCorePackage.java" <<'JAVA_EOF'
          package expo.modules.firebase.core;
          import expo.modules.core.BasePackage;
          public class FirebaseCorePackage extends BasePackage {}
          JAVA_EOF
              cat > "$SRC/FirebaseCoreModule.java" <<'JAVA_EOF'
          package expo.modules.firebase.core;
          import android.content.Context;
          public class FirebaseCoreModule {
            public FirebaseCoreModule(Context context) {}
            public String getName() { return "ExpoFirebaseCore"; }
          }
          JAVA_EOF
              echo "✅ expo-firebase-core Java stubs written: $SRC"
            else
              echo "⚠️  expo-firebase-core source not found at: $SRC"
            fi
          done < <(find node_modules -path "*/expo-firebase-core/android/build.gradle" 2>/dev/null)

      - name: Add custom notification sounds
        run: |
          mkdir -p artifacts/hasahisawi/android/app/src/main/res/raw
          SRC=artifacts/hasahisawi/assets/sounds
          DEST=artifacts/hasahisawi/android/app/src/main/res/raw
          # Default / transport channel — أذان
          cp "$SRC/adhan.mp3"                "$DEST/hasahisawi_notif.mp3"
          # Chat channel
          cp "$SRC/hasahisawi_chat.wav"      "$DEST/hasahisawi_chat.wav"
          # Urgent / alert channel
          cp "$SRC/hasahisawi_urgent.wav"    "$DEST/hasahisawi_urgent.wav"
          # Prayer channel — أذان بصيغة mp3
          cp "$SRC/adhan.mp3"                "$DEST/hasahisawi_prayer.mp3"
          echo "✅ Notification sounds added to res/raw:"
          ls -lh "$DEST/"

      - name: Create .env
        working-directory: artifacts/hasahisawi
        run: |
          printf '%s\n' \
            'EXPO_PUBLIC_FIREBASE_API_KEY=AIzaSyC0o8hr3Dp0hgqKovIDUM0PSCbqgBABvx8' \
            'EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=hasahisawi.firebaseapp.com' \
            'EXPO_PUBLIC_FIREBASE_PROJECT_ID=hasahisawi' \
            'EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=hasahisawi.firebasestorage.app' \
            'EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=133656291161' \
            'EXPO_PUBLIC_FIREBASE_APP_ID=1:133656291161:android:7d0a88a80d3be1af418e48' \
            'EXPO_PUBLIC_API_URL=https://api-server-gilt-ten.vercel.app' \
            'EXPO_PUBLIC_DISABLE_OTP=true' > .env

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > artifacts/hasahisawi/android/local.properties

      - name: Setup release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_DEST=artifacts/hasahisawi/android/app/release.keystore
          if [ -z "$KEYSTORE_B64" ]; then
            echo "❌ KEYSTORE_BASE64 secret is missing. Refusing to build a release APK/AAB with an unknown signing key."
            echo "Add the original release keystore as GitHub secret KEYSTORE_BASE64, with KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_DEST"
          test -s "$KEYSTORE_DEST"
          echo "✅ Release keystore restored ($(wc -c < $KEYSTORE_DEST) bytes)"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-v6-${{ hashFiles('artifacts/hasahisawi/android/gradle/wrapper/gradle-wrapper.properties', 'artifacts/hasahisawi/android/build.gradle', 'artifacts/hasahisawi/android/app/build.gradle') }}
          restore-keys: gradle-v6-
          save-always: true

      - name: Pre-build setup
        run: |
          PROPS=artifacts/hasahisawi/android/gradle.properties
          # Keep newArchEnabled=true — reanimated 4.x requires New Architecture.
          # Disabling it causes: GradleException("[Reanimated] Reanimated requires new architecture")
          # OOM is prevented instead by parallel=false (Metro and C++ run sequentially, not simultaneously)
          sed -i 's/edgeToEdgeEnabled=true/edgeToEdgeEnabled=false/' $PROPS
          # Build arm64-v8a only — covers all modern Android phones, reduces C++ compilation by 75%
          echo "reactNativeArchitectures=arm64-v8a" >> $PROPS
          # 4GB swap keeps JVM+Metro within 11GB virtual; 2560m JVM leaves headroom for Metro (3.5GB)
          echo "org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError" >> $PROPS
          echo "org.gradle.parallel=false" >> $PROPS
          echo "org.gradle.workers.max=1" >> $PROPS
          echo "org.gradle.caching=true" >> $PROPS
          echo "org.gradle.configuration-cache=false" >> $PROPS
          echo "=== gradle.properties tail ==="
          tail -12 $PROPS
          echo "=== NDK: $(ls $ANDROID_HOME/ndk/ 2>/dev/null || echo NOT FOUND) ==="
          echo "=== Build-tools: $(ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo NOT FOUND) ==="
          echo "=== Keystore: $(ls -la artifacts/hasahisawi/android/app/release.keystore 2>/dev/null || echo NOT FOUND) ==="
          # Gradle 8.13 removed AbstractArchiveTask.classifier — patch expo-firebase-core@6.0.0
          # pnpm workspace stores all packages in root-level node_modules/.pnpm/
          while IFS= read -r FIREBASE_BUILD; do
            sed -i "s/classifier = 'sources'/archiveClassifier = 'sources'/g" "$FIREBASE_BUILD"
            sed -i 's/classifier = "sources"/archiveClassifier = "sources"/g' "$FIREBASE_BUILD"
            echo "✅ Patched: $FIREBASE_BUILD"
          done < <(find node_modules -path "*/expo-firebase-core/android/build.gradle" 2>/dev/null)

      - name: Build release AAB
        working-directory: artifacts/hasahisawi/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NODE_OPTIONS: "--max-old-space-size=3584"
        run: |
          chmod +x gradlew
          echo "=== RAM before AAB build ===" && free -h
          ./gradlew bundleRelease \
            --no-daemon \
            --build-cache \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/artifacts/hasahisawi/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          echo "=== RAM after AAB build ===" && free -h

      - name: Build release APK
        working-directory: artifacts/hasahisawi/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NODE_OPTIONS: "--max-old-space-size=3584"
        run: |
          echo "=== RAM before APK build ===" && free -h
          ./gradlew assembleRelease \
            --no-daemon \
            --build-cache \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/artifacts/hasahisawi/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          echo "=== RAM after APK build ===" && free -h

      - name: Rename artifacts
        run: |
          cp artifacts/hasahisawi/android/app/build/outputs/apk/release/app-release.apk \
             hasahisawi-v${{ steps.ver.outputs.version }}.apk
          cp artifacts/hasahisawi/android/app/build/outputs/bundle/release/app-release.aab \
             hasahisawi-v${{ steps.ver.outputs.version }}.aab
          ls -lh hasahisawi-v*.apk hasahisawi-v*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: hasahisawi-v${{ steps.ver.outputs.version }}.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: hasahisawi-v${{ steps.ver.outputs.version }}.aab
          retention-days: 30

      - name: Cleanup secrets
        if: always()
        run: rm -f artifacts/hasahisawi/android/app/release.keystore artifacts/hasahisawi/.env

  # ─── Build + Deploy Web PWA → docs/ on master ───────────────────────
  deploy-web:
    name: Build + Deploy Web PWA
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --no-frozen-lockfile

      - name: Export web
        working-directory: artifacts/hasahisawi
        run: pnpm exec expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://api-server-gilt-ten.vercel.app
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyC0o8hr3Dp0hgqKovIDUM0PSCbqgBABvx8
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: hasahisawi.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: hasahisawi
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: hasahisawi.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '133656291161'
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:133656291161:web:7d0a88a80d3be1af418e48
          EXPO_PUBLIC_DISABLE_OTP: 'true'

      - name: Add PWA files
        working-directory: artifacts/hasahisawi
        run: |
          cp -r public/splash dist/splash 2>/dev/null || true
          cp public/sw.js dist/sw.js 2>/dev/null || true
          cp public/manifest.json dist/manifest.json 2>/dev/null || true
          cp public/icon.png   dist/icon.png   2>/dev/null || true
          cp public/favicon.png dist/favicon.png 2>/dev/null || true
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          echo '/* /index.html 200' > dist/_redirects
          printf '%s\n' \
            '/*' \
            '  X-Frame-Options: DENY' \
            '  X-Content-Type-Options: nosniff' \
            '  Referrer-Policy: strict-origin-when-cross-origin' \
            '  Permissions-Policy: camera=(), microphone=(), geolocation=()' \
            '  X-XSS-Protection: 1; mode=block' \
            '' \
            '/_expo/*' \
            '  Cache-Control: public, max-age=31536000, immutable' \
            '' \
            '/assets/*' \
            '  Cache-Control: public, max-age=31536000, immutable' \
            '' \
            '/splash/*' \
            '  Cache-Control: public, max-age=86400' \
            > dist/_headers

      - name: Deploy to GitHub Pages (docs/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git reset --hard origin/master
          rm -rf docs
          mkdir -p docs
          cp -r artifacts/hasahisawi/dist/. docs/
          git add -f docs/
          git commit -m "deploy: web PWA v${{ needs.build-android.outputs.version || 'latest' }} [auto]" || echo "No docs changes"
          git push origin HEAD:master

  # ─── Publish GitHub Release with APK + AAB ─────────────────────────
  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-android
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: aab
          path: release-assets
      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hasahisawi-v${{ needs.build-android.outputs.version }}
          name: حصاحيصاوي v${{ needs.build-android.outputs.version }}
          body: |
            إصدار Android تلقائي.

            الملفات:
            - APK للتثبيت المباشر
            - AAB لرفع Google Play

            ملاحظة مهمة: إذا ظهرت رسالة تعارض أثناء تثبيت APK يدويًا، احذف النسخة المثبتة سابقًا أولًا أو استخدم APK موقّعًا بنفس keystore الأصلي.
          files: release-assets/*
          fail_on_unmatched_files: true
