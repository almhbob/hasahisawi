name: Build preview APK v2

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies for preview build
        run: pnpm install --no-frozen-lockfile

      - name: Build APK with EAS
        working-directory: artifacts/hasahisawi
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > eas-build-result.json
          cat eas-build-result.json

      - name: Download APK
        working-directory: artifacts/hasahisawi
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('eas-build-result.json', 'utf8');
          const parsed = JSON.parse(raw);
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const url = build?.artifacts?.buildUrl || build?.artifactUrl || build?.artifacts?.applicationArchiveUrl;
          if (!url) {
            console.error('Could not find APK artifact URL in EAS result.');
            process.exit(1);
          }
          fs.writeFileSync('apk-url.txt', url + '\n');
          console.log(url);
          NODE
          curl -L "$(cat apk-url.txt)" -o hasahisawi-preview.apk
          ls -lh hasahisawi-preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasahisawi-preview-apk
          path: artifacts/hasahisawi/hasahisawi-preview.apk
          retention-days: 14

      - name: Upload EAS build URL
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-url
          path: artifacts/hasahisawi/apk-url.txt
          retention-days: 14
