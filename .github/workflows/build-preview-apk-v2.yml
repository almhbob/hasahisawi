name: Build preview APK v2

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-preview-apk-v2.yml'
      - 'artifacts/hasahisawi/**'

jobs:
  build-apk-aab:
    name: Build standalone Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android project
        working-directory: artifacts/hasahisawi
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://workspaceapi-server-production-3e22.up.railway.app
        run: pnpm run apk:prepare

      - name: Create preview signing key
        working-directory: artifacts/hasahisawi/android
        run: |
          keytool -genkeypair -v -storetype PKCS12 -keystore preview-release-key.p12 -alias preview -keyalg RSA -keysize 2048 -validity 10000 -storepass preview1234 -keypass preview1234 -dname "CN=Hasahisawi Preview,O=Hasahisawi,C=SD"

      - name: Build signed release APK and AAB
        working-directory: artifacts/hasahisawi/android
        env:
          NODE_ENV: production
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://workspaceapi-server-production-3e22.up.railway.app
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            -Pandroid.injected.signing.store.file="$PWD/preview-release-key.p12" \
            -Pandroid.injected.signing.store.password="preview1234" \
            -Pandroid.injected.signing.key.alias="preview" \
            -Pandroid.injected.signing.key.password="preview1234"

      - name: Verify release outputs
        run: |
          APK="artifacts/hasahisawi/android/app/build/outputs/apk/release/app-release.apk"
          AAB="artifacts/hasahisawi/android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"
          unzip -l "$APK" | grep -E "assets/index.android.bundle|index.android.bundle"
          ls -lh "$APK" "$AAB"

      - name: Prepare artifacts
        run: |
          mkdir -p android-output
          cp artifacts/hasahisawi/android/app/build/outputs/apk/release/app-release.apk android-output/hasahisawi-preview-release.apk
          cp artifacts/hasahisawi/android/app/build/outputs/bundle/release/app-release.aab android-output/hasahisawi-preview-release.aab
          ls -lh android-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasahisawi-preview-release-apk
          path: android-output/hasahisawi-preview-release.apk
          retention-days: 14

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasahisawi-preview-release-aab
          path: android-output/hasahisawi-preview-release.aab
          retention-days: 14