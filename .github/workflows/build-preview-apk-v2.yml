name: Build preview APK v2

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-preview-apk-v2.yml'
      - 'artifacts/hasahisawi/**'

jobs:
  build-apk:
    name: Build standalone Android APK locally
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android project
        working-directory: artifacts/hasahisawi
        run: pnpm run apk:prepare

      - name: Build installable debug APK
        working-directory: artifacts/hasahisawi/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p apk-output
          cp artifacts/hasahisawi/android/app/build/outputs/apk/debug/app-debug.apk apk-output/hasahisawi-preview-debug.apk
          ls -lh apk-output/hasahisawi-preview-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasahisawi-preview-debug-apk
          path: apk-output/hasahisawi-preview-debug.apk
          retention-days: 14