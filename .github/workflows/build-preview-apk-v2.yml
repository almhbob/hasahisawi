name: Build preview APK v2

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build standalone Android APK locally
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android project
        working-directory: artifacts/hasahisawi
        run: pnpm run apk:prepare

      - name: Build standalone release APK
        working-directory: artifacts/hasahisawi/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p apk-output
          cp artifacts/hasahisawi/android/app/build/outputs/apk/release/app-release.apk apk-output/hasahisawi-preview-standalone.apk
          ls -lh apk-output/hasahisawi-preview-standalone.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasahisawi-preview-standalone-apk
          path: apk-output/hasahisawi-preview-standalone.apk
          retention-days: 14
