name: Build preview APK v2

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-preview-apk-v2.yml'
      - 'artifacts/hasahisawi/**'

jobs:
  build-apk:
    name: Build standalone Android APK locally
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android project
        working-directory: artifacts/hasahisawi
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://workspaceapi-server-production-3e22.up.railway.app
        run: pnpm run apk:prepare

      - name: Build standalone release APK
        working-directory: artifacts/hasahisawi/android
        env:
          NODE_ENV: production
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://workspaceapi-server-production-3e22.up.railway.app
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --info

      - name: Verify APK contains bundled JS
        run: |
          APK="artifacts/hasahisawi/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -E "assets/index.android.bundle|index.android.bundle"

      - name: Prepare APK artifact
        run: |
          mkdir -p apk-output
          cp artifacts/hasahisawi/android/app/build/outputs/apk/release/app-release.apk apk-output/hasahisawi-preview-release.apk
          ls -lh apk-output/hasahisawi-preview-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasahisawi-preview-release-apk
          path: apk-output/hasahisawi-preview-release.apk
          retention-days: 14