name: tmp voiceover fetch
on:
  push:
    branches: [tmp/vo-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p promo-vo
          curl -fsSL -o promo-vo/vo.mp3 "$VO_URL"
          ls -la promo-vo
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git rm -q --cached .github/workflows/tmp-vo-fetch.yml
          git add promo-vo/vo.mp3
          git commit -m "tmp: voiceover [skip ci]"
          git push --force origin HEAD:tmp/vo-fetch-out
        env:
          VO_URL: "https://storage.googleapis.com/xi-backend/database/workspace/ed5caf9fd6584446a8bd197107556a82/content_generation/dzBQVfZopqzC18GBNaHt/GNG2wIh3UjTlGx4zSwGh/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261101%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261101T192837Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-"
