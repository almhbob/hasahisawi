name: API service E2E

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'artifacts/api-server/**'
      - '.github/workflows/api-service-e2e.yml'
  push:
    branches: [master]
    paths:
      - 'artifacts/api-server/**'
      - '.github/workflows/api-service-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-e2e:
    name: Join requests and service journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build API server
        working-directory: artifacts/api-server
        run: node build.mjs

      - name: Run isolated service tests
        working-directory: artifacts/api-server
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          NODE_ENV: development
          PORT: '8080'
        run: |
          set -euo pipefail
          node dist/index.mjs > "$RUNNER_TEMP/api-e2e.log" 2>&1 &
          api_pid=$!
          cleanup() {
            status=$?
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then tail -n 120 "$RUNNER_TEMP/api-e2e.log"; fi
            exit "$status"
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/api/healthz >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then echo "API did not start"; exit 1; fi
          node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          let ready = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            const result = await client.query("SELECT to_regclass('public.users') AS users, to_regclass('public.user_sessions') AS sessions, to_regclass('public.admin_alerts') AS alerts");
            const row = result.rows[0];
            if (row.users && row.sessions && row.alerts) { ready = true; break; }
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          await client.end();
          if (!ready) { console.error("API test schema did not initialize"); process.exit(1); }
          NODE
          node qa/e2e-requests.mjs
