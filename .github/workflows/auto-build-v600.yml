name: Auto Build v6.0.0 — APK + AAB (Signed)

on:
  push:
    branches: [claude/define-app-requirements-638Qf]

jobs:
  build:
    name: Build Signed APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(node -e "console.log(require('./artifacts/hasahisawi/app.json').expo.version)")
          VERSION_CODE=$(node -e "console.log(require('./artifacts/hasahisawi/app.json').expo.android.versionCode)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Building v$VERSION (versionCode: $VERSION_CODE)"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Write Firebase + API env
        working-directory: artifacts/hasahisawi
        run: |
          cat > .env << 'EOF'
          EXPO_PUBLIC_FIREBASE_API_KEY=AIzaSyC0o8hr3Dp0hgqKovIDUM0PSCbqgBABvx8
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=hasahisawi.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID=hasahisawi
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=hasahisawi.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=133656291161
          EXPO_PUBLIC_FIREBASE_APP_ID=1:133656291161:android:7d0a88a80d3be1af418e48
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID=G-8NDWWB1735
          EXPO_PUBLIC_API_URL=https://hasahisawi-api-asim-abdulrahman-mohammed.vercel.app
          EXPO_PUBLIC_DOMAIN=hasahisawi-api-asim-abdulrahman-mohammed.vercel.app
          EOF

      - name: Expo Prebuild
        working-directory: artifacts/hasahisawi
        env:
          EXPO_NO_TELEMETRY: 1
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Decode Keystore
        working-directory: artifacts/hasahisawi/android
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Print SHA-1 fingerprint
        working-directory: artifacts/hasahisawi/android
        run: |
          echo "Keystore SHA-1:"
          keytool -list -v \
            -keystore release.keystore \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" 2>/dev/null \
            | grep "SHA1:" | head -1

      - name: Build AAB + APK
        working-directory: artifacts/hasahisawi/android
        run: |
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Package artifacts
        id: pkg
        run: |
          mkdir -p release
          V="${{ steps.app_version.outputs.version }}"
          VC="${{ steps.app_version.outputs.version_code }}"
          cp artifacts/hasahisawi/android/app/build/outputs/bundle/release/app-release.aab \
             release/hasahisawi-v${V}-code${VC}.aab
          APK=$(find artifacts/hasahisawi/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          [ -n "$APK" ] && cp "$APK" release/hasahisawi-v${V}-code${VC}.apk
          ls -lh release/

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: hasahisawi-v${{ steps.app_version.outputs.version }}-code${{ steps.app_version.outputs.version_code }}-aab
          path: release/*.aab
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hasahisawi-v${{ steps.app_version.outputs.version }}-code${{ steps.app_version.outputs.version_code }}-apk
          path: release/*.apk
          retention-days: 30
          if-no-files-found: warn
