name: Deploy API Server to Vercel

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'artifacts/api-server/**'
      - '.api-deploy-trigger'

jobs:
  deploy:
    name: Build + Deploy API to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/api-server

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: artifacts/api-server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json << 'EOF'
          {"projectId":"prj_7NqIloolEKoPpF5JKr3KVWjapKVw","orgId":"team_RTCz9oaxsbHBdJHrSJNyJr5q"}
          EOF

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_RTCz9oaxsbHBdJHrSJNyJr5q
          VERCEL_PROJECT_ID: prj_7NqIloolEKoPpF5JKr3KVWjapKVw
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "⚠️  VERCEL_TOKEN not set — skipping"
            echo "Add VERCEL_TOKEN to GitHub secrets"
            exit 1
          fi
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          echo "✅ API deployed to Vercel → https://api-server-gilt-ten.vercel.app"
