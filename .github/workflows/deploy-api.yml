name: Deploy API Server to Vercel

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'artifacts/api-server/**'
      - '.api-deploy-trigger'

jobs:
  deploy:
    name: Build + Deploy API to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/api-server

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build TypeScript
        run: node build.mjs

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_RTCz9oaxsbHBdJHrSJNyJr5q
          VERCEL_PROJECT_ID: prj_7NqIloolEKoPpF5JKr3KVWjapKVw
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set"
            exit 1
          fi
          echo "VERCEL_TOKEN length: ${#VERCEL_TOKEN}"

          # Run a Vercel CLI step; on failure surface the last lines as annotations
          # (readable from the Checks API) so failures can be diagnosed without raw logs.
          run_step() {
            local label="$1"; shift
            local log="/tmp/vercel-${label}.log"
            if ! "$@" >"$log" 2>&1; then
              cat "$log"
              echo "::error title=vercel ${label} failed::$(tail -n 15 "$log" | sed 's/%/%25/g' | tr '\n' '|' | sed "s/${VERCEL_TOKEN}/***/g")"
              exit 1
            fi
            cat "$log"
          }

          run_step whoami npx vercel@latest whoami --token="$VERCEL_TOKEN"
          run_step pull   npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          run_step build  npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          run_step deploy npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          echo "✅ API deployed to Vercel → https://api-server-gilt-ten.vercel.app"
