name: Sync Vercel DATABASE_URL from Railway

# Builds the PUBLIC connection URL of the Hasahisawi Postgres (lively-mindfulness) from
# Railway variables, proves it works with the same pg driver/config the API uses,
# and only then writes it to the Vercel api-server project and redeploys.
# If any check fails, Vercel is left untouched.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.sync-db-trigger'

permissions:
  contents: read

env:
  # Primary database since 2026-10-20 (merged): lively-mindfulness Postgres.
  # sunny-peace Postgres is kept untouched as an archive.
  RW_PROJECT: e82d86db-7b87-4446-9968-f60934f618b4      # lively-mindfulness
  RW_ENV: f708e9d6-bbfa-4562-9a58-3e41977b40ed          # production
  RW_POSTGRES: 984dd90a-b068-4089-a823-859d353c02ca     # Postgres
  # Railway API service (lives in sunny-peace) that must use the same database
  RW_API_PROJECT: 4e3750d2-5221-479b-8085-66d31758e83e
  RW_API_ENV: 28cc17ed-7b04-4e49-a284-ada04c98f3fb
  RW_API_SERVICE: 4296d176-326f-411f-8f3e-2a8536b23e43
  VC_TEAM: team_RTCz9oaxsbHBdJHrSJNyJr5q
  VC_PROJECT: prj_7NqIloolEKoPpF5JKr3KVWjapKVw          # api-server
  MIN_USERS: '860'

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Build public DATABASE_URL from Railway
        id: db
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_TOKEN:-}" ] || { echo "::error::RAILWAY_TOKEN secret is not set"; exit 1; }
          Q=$(printf '{"query":"query { variables(projectId: \\"%s\\", environmentId: \\"%s\\", serviceId: \\"%s\\") }"}' "$RW_PROJECT" "$RW_ENV" "$RW_POSTGRES")
          fetch() { curl -sS -X POST https://backboard.railway.com/graphql/v2 -H "Content-Type: application/json" "$@" -d "$Q"; }
          RAW=$(fetch -H "Authorization: Bearer $RAILWAY_TOKEN")
          if ! printf '%s' "$RAW" | grep -q '"variables"'; then
            RAW=$(fetch -H "Project-Access-Token: $RAILWAY_TOKEN")
          fi
          URL=$(printf '%s' "$RAW" | python3 -c '
          import json, sys, urllib.parse as u
          d = json.load(sys.stdin)
          if d.get("errors"):
              sys.stderr.write("Railway API error: " + d["errors"][0].get("message", "")[:200] + "\n"); sys.exit(1)
          v = (d.get("data") or {}).get("variables") or {}
          host, port = v.get("RAILWAY_TCP_PROXY_DOMAIN"), v.get("RAILWAY_TCP_PROXY_PORT")
          user = v.get("POSTGRES_USER") or v.get("PGUSER") or "postgres"
          pw = v.get("POSTGRES_PASSWORD") or v.get("PGPASSWORD")
          db = v.get("POSTGRES_DB") or v.get("PGDATABASE") or "railway"
          if not (host and port and pw):
              sys.stderr.write("Missing proxy host/port/password; keys seen: " + ",".join(sorted(v)) + "\n"); sys.exit(1)
          print("postgresql://%s:%s@%s:%s/%s?sslmode=no-verify" % (u.quote(user, safe=""), u.quote(pw, safe=""), host, port, db))
          ')
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Built public URL for $(printf '%s' "$URL" | sed -E 's#//[^@]+@#//***@#')"

      - name: Prove the URL works with the API's pg driver
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pgtest && cd /tmp/pgtest && npm init -y >/dev/null && npm i --silent pg@8.20.0 >/dev/null
          cat > t.mjs <<'JS'
          import pg from "pg";
          const url = process.env.DATABASE_URL;
          // Same config as artifacts/api-server/src/routes/hasahisawi.ts
          const pool = new pg.Pool({
            connectionString: url, connectionTimeoutMillis: 8000, max: 1,
            ssl: url.includes("sslmode=require") || url.includes("ssl=true") ? { rejectUnauthorized: false } : false,
          });
          const r = await pool.query("SELECT COUNT(*)::int AS n FROM users");
          await pool.end();
          const n = r.rows[0].n, min = Number(process.env.MIN_USERS);
          console.log(`::notice title=database check::connected, users=${n}`);
          if (n < min) { console.log(`::error::Only ${n} users (expected >= ${min}); refusing to point Vercel at this database`); process.exit(1); }
          JS
          node t.mjs

      - name: Update Vercel DATABASE_URL
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: |
          set -euo pipefail
          BODY=$(python3 -c 'import json,os; print(json.dumps({"key":"DATABASE_URL","value":os.environ["DATABASE_URL"],"type":"encrypted","target":["production","preview"]}))')
          RES=$(curl -sS -X POST "https://api.vercel.com/v10/projects/$VC_PROJECT/env?teamId=$VC_TEAM&upsert=true" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" -d "$BODY")
          printf '%s' "$RES" | python3 -c 'import json,sys; d=json.load(sys.stdin); e=d.get("error");
          print("::error::Vercel env update failed: %s" % e.get("message")) if e else print("::notice title=vercel env::DATABASE_URL updated")
          sys.exit(1 if e else 0)'

      - name: Point the Railway API service at the same database
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: |
          set -euo pipefail
          gql() { curl -sS -X POST https://backboard.railway.com/graphql/v2 -H "Content-Type: application/json" -H "Authorization: Bearer $RAILWAY_TOKEN" -d "$1"; }
          BODY=$(python3 -c 'import json,os; print(json.dumps({"query":"mutation($i: VariableUpsertInput!){ variableUpsert(input:$i) }","variables":{"i":{"projectId":os.environ["RW_API_PROJECT"],"environmentId":os.environ["RW_API_ENV"],"serviceId":os.environ["RW_API_SERVICE"],"name":"DATABASE_URL","value":os.environ["DATABASE_URL"]}}}))')
          R=$(gql "$BODY"); printf '%s' "$R" | grep -q '"variableUpsert":true' || { echo "::error::Railway variableUpsert failed: $(printf '%s' "$R" | head -c 300)"; exit 1; }
          echo "::notice title=railway env::DATABASE_URL of hasahisawi service updated"
          R=$(gql "$(printf '{"query":"mutation { serviceInstanceRedeploy(environmentId: \"%s\", serviceId: \"%s\") }"}' "$RW_API_ENV" "$RW_API_SERVICE")")
          echo "::notice title=railway redeploy::$(printf '%s' "$R" | head -c 200)"

      - name: Redeploy latest production build with the new env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          UID_=$(curl -sS "https://api.vercel.com/v6/deployments?projectId=$VC_PROJECT&teamId=$VC_TEAM&target=production&state=READY&limit=1" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["deployments"][0]["uid"])')
          NEW=$(curl -sS -X POST "https://api.vercel.com/v13/deployments?teamId=$VC_TEAM&forceNew=1" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            -d "{\"deploymentId\":\"$UID_\",\"name\":\"api-server\",\"target\":\"production\"}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id") or ("ERR " + str(d.get("error"))))')
          echo "redeploy of $UID_ -> $NEW"
          case "$NEW" in ERR*) echo "::error::$NEW"; exit 1;; esac
          for i in $(seq 1 40); do
            S=$(curl -sS "https://api.vercel.com/v13/deployments/$NEW?teamId=$VC_TEAM" -H "Authorization: Bearer $VERCEL_TOKEN" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("readyState"))')
            echo "state=$S"; [ "$S" = READY ] && break; [ "$S" = ERROR ] && { echo "::error::redeploy failed"; exit 1; }; sleep 10
          done

      - name: Verify the app's API
        run: |
          sleep 10
          S=$(curl -s --max-time 30 https://api-server-gilt-ten.vercel.app/api/stats)
          echo "::notice title=vercel /api/stats::$S"
          echo "$S" | grep -q '"users"' || { echo "::error::Vercel API still not reading the database"; exit 1; }
          L=$(curl -s --max-time 30 https://api-server-gilt-ten.vercel.app/api/lawyers | python3 -c 'import json,sys; d=json.load(sys.stdin); d=d.get("lawyers",d) if isinstance(d,dict) else d; print(len(d))' 2>&1)
          echo "::notice title=vercel /api/lawyers::count=$L"
