name: "Things Unsaid" series (daily)
# ينشر نص اليوم من campaign/unsaid/calendar.json (سلسلة «أشياء لا تقال» — ٥٠ يوماً)
# على تيك توك وفيسبوك وإنستغرام وتيليجرام عبر خادم التطبيق. كل قناة مرة واحدة يومياً (الخادم يمنع التكرار).
on:
  schedule:
    - cron: '7 18 * * *'   # 9:07 مساءً بتوقيت الرياض
  workflow_dispatch:
    inputs:
      day:
        description: 'رقم النص/اليوم (اتركه فارغاً لليوم الحالي)'
        required: false
      only:
        description: 'قنوات محددة مفصولة بفواصل، مثل: tiktok,telegram (فارغ = الكل)'
        required: false
permissions:
  contents: read
  id-token: write
concurrency: { group: campaign-unsaid, cancel-in-progress: false }
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post today's text
        env:
          API: https://api-server-gilt-ten.vercel.app
          DAY: ${{ github.event.inputs.day }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -euo pipefail
          tok() { curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=hasahisawi-campaign" | jq -r .value; }
          BODY=$(jq -n --arg d "${DAY:-}" --arg o "${ONLY:-}" '{calendar: "unsaid"}
            + (if $d == "" then {} else {day: ($d|tonumber)} end)
            + (if $o == "" then {} else {only: ($o | split(",") | map(gsub("^\\s+|\\s+$"; "")))} end)')
          T=$(tok); echo "::add-mask::$T"
          R=$(curl -sS -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$BODY" "$API/api/campaign/run")
          echo "$R" | jq .
          echo "### «أشياء لا تقال» — النشر" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY; echo "$R" | jq . >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY
          # إنستغرام وتيك توك يعالجان الفيديو لبضع دقائق: نتابع حتى يكتمل النشر
          if echo "$R" | jq -e '.instagram.container or .tiktok.publish_id' >/dev/null 2>&1; then
            P='{}'
            for i in 1 2 3 4 5; do
              sleep 75
              T=$(tok); echo "::add-mask::$T"
              P=$(curl -sS -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$BODY" "$API/api/campaign/run?phase=publish")
              echo "$P" | jq .
              echo "$P" | jq -e '.instagram.waiting or .tiktok.waiting' >/dev/null 2>&1 || break
            done
            echo '```json' >> $GITHUB_STEP_SUMMARY; echo "$P" | jq . >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if echo "$R" | jq -e '[.facebook, .telegram, .instagram, .tiktok] | map(select(. != null and .error != null)) | length > 0' >/dev/null; then
            echo "::warning::بعض القنوات فشلت — راجع الملخص"
          fi
