name: Deploy Web PWA

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'artifacts/hasahisawi/app/**'
      - 'artifacts/hasahisawi/lib/**'
      - 'artifacts/hasahisawi/components/**'
      - 'artifacts/hasahisawi/app.json'
      - '.web-deploy-trigger'

permissions:
  contents: write
  pages: write
  deployments: write

jobs:
  deploy:
    name: Build + Deploy Web PWA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: artifacts/hasahisawi/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: artifacts/hasahisawi
        run: pnpm install --no-frozen-lockfile

      - name: Export web
        working-directory: artifacts/hasahisawi
        run: pnpm exec expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://api-server-gilt-ten.vercel.app
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyC0o8hr3Dp0hgqKovIDUM0PSCbqgBABvx8
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: hasahisawi.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: hasahisawi
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: hasahisawi.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '133656291161'
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:133656291161:web:7d0a88a80d3be1af418e48
          EXPO_PUBLIC_DISABLE_OTP: 'true'

      - name: Add PWA + Cloudflare files
        working-directory: artifacts/hasahisawi
        run: |
          cp -r public/splash dist/splash 2>/dev/null || true
          cp public/sw.js dist/sw.js 2>/dev/null || true
          cp public/manifest.json dist/manifest.json 2>/dev/null || true
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

          # SPA fallback for Cloudflare Pages
          echo '/* /index.html 200' > dist/_redirects

          # Security + caching headers for Cloudflare Pages
          cat > dist/_headers << 'HEADERS_EOF'
/*
  X-Frame-Options: DENY
  X-Content-Type-Options: nosniff
  Referrer-Policy: strict-origin-when-cross-origin
  Permissions-Policy: camera=(), microphone=(), geolocation=()
  X-XSS-Protection: 1; mode=block

/_expo/*
  Cache-Control: public, max-age=31536000, immutable

/assets/*
  Cache-Control: public, max-age=31536000, immutable

/splash/*
  Cache-Control: public, max-age=86400
HEADERS_EOF

      - name: Deploy to GitHub Pages (docs/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git reset --hard origin/master
          rm -rf docs/
          mkdir -p docs
          cp -r artifacts/hasahisawi/dist/. docs/
          git add -f docs/
          git diff --cached --quiet && echo "No changes to deploy" || \
            git commit -m "deploy: web PWA → docs/ [auto]"
          git push origin master

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "⚠️  CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set — skipping"
          else
            # إنشاء المشروع إذا لم يكن موجوداً
            curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"name":"hasahisawi","production_branch":"master"}' \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print('Project OK:', d.get('result',{}).get('subdomain','already exists'))" || true

            # إنشاء نسخة Cloudflare: إزالة prefix /hasahisawi/ من HTML
            cp -r docs cf-dist

            # إصلاح مسارات HTML
            find cf-dist -name "*.html" -exec sed -i 's|"/hasahisawi/|"/|g' {} \;

            # نسخ الخطوط لمسار بسيط /fonts/ (تجنب %40 encoding لـ @ في المسارات)
            mkdir -p cf-dist/fonts
            find cf-dist/assets/__node_modules -name "*.ttf" -exec cp {} cf-dist/fonts/ \;

            # إنشاء CSS لإعادة توجيه @font-face للمسار الجديد
            for f in cf-dist/fonts/*.ttf; do
              fname=$(basename "$f")
              fontname=$(echo "$fname" | sed 's/\.[a-f0-9]\{32\}\.ttf$//')
              echo "@font-face { font-family: '${fontname}'; src: url('/fonts/${fname}') format('truetype'); }"
            done > /tmp/fonts-override.css

            # حقن CSS في index.html
            python3 -c "
import sys
with open('cf-dist/index.html','r') as f: c=f.read()
with open('/tmp/fonts-override.css','r') as f: css=f.read()
c=c.replace('</head>','<style id=\"cf-fonts\">' + css + '</style></head>',1)
with open('cf-dist/index.html','w') as f: f.write(c)
cp_404=c
with open('cf-dist/404.html','w') as f: f.write(cp_404)
print('Fonts CSS injected')
"

            npx wrangler@3 pages deploy cf-dist \
              --project-name=hasahisawi \
              --branch=master
            echo "✅ Cloudflare Pages → https://hasahisawi.pages.dev"
          fi

      - run: |
          echo "✅ GitHub Pages → https://almhbob.github.io/hasahisawi/"
          echo "✅ Cloudflare Pages → https://hasahisawi.pages.dev"
