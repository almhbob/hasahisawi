name: Deploy Web PWA

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'artifacts/hasahisawi/app/**'
      - 'artifacts/hasahisawi/lib/**'
      - 'artifacts/hasahisawi/components/**'
      - 'artifacts/hasahisawi/app.json'
      - '.web-deploy-trigger'

permissions:
  contents: write
  pages: write
  deployments: write

jobs:
  deploy:
    name: Build + Deploy Web PWA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --no-frozen-lockfile

      - name: Export web
        working-directory: artifacts/hasahisawi
        run: pnpm exec expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://hasahisawi-api-asim-abdulrahman-mohammed.vercel.app
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyC0o8hr3Dp0hgqKovIDUM0PSCbqgBABvx8
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: hasahisawi.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: hasahisawi
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: hasahisawi.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '133656291161'
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:133656291161:android:7d0a88a80d3be1af418e48
          EXPO_PUBLIC_DISABLE_OTP: 'true'

      - name: Add PWA + Cloudflare files
        working-directory: artifacts/hasahisawi
        run: |
          cp -r public/splash dist/splash 2>/dev/null || true
          cp public/sw.js dist/sw.js 2>/dev/null || true
          cp public/manifest.json dist/manifest.json 2>/dev/null || true
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

          # SPA fallback for Cloudflare Pages
          echo '/* /index.html 200' > dist/_redirects

          # Security + caching headers for Cloudflare Pages
          cat > dist/_headers << 'HEADERS_EOF'
/*
  X-Frame-Options: DENY
  X-Content-Type-Options: nosniff
  Referrer-Policy: strict-origin-when-cross-origin
  Permissions-Policy: camera=(), microphone=(), geolocation=()
  X-XSS-Protection: 1; mode=block

/_expo/*
  Cache-Control: public, max-age=31536000, immutable

/assets/*
  Cache-Control: public, max-age=31536000, immutable

/splash/*
  Cache-Control: public, max-age=86400
HEADERS_EOF

      - name: Deploy to GitHub Pages (docs/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git reset --hard origin/master
          rm -rf docs/
          mkdir -p docs
          cp -r artifacts/hasahisawi/dist/. docs/
          git add -f docs/
          git diff --cached --quiet && echo "No changes to deploy" || \
            git commit -m "deploy: web PWA → docs/ [auto]"
          git push origin master

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "⚠️  CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set — skipping"
            echo "ℹ️  Add these secrets to enable Cloudflare Pages auto-deploy"
          else
            VERSION=$(python3 -c "import sys,json; print(json.load(open('artifacts/hasahisawi/app.json'))['expo']['version'])")
            npx wrangler@latest pages deploy docs \
              --project-name=hasahisawi \
              --commit-dirty=true \
              --commit-message="PWA v${VERSION}"
            echo "✅ Cloudflare Pages deploy complete → https://hasahisawi.pages.dev"
          fi

      - run: |
          echo "✅ GitHub Pages → https://almhbob.github.io/hasahisawi/"
          echo "✅ Cloudflare Pages → https://hasahisawi.pages.dev"
