name: Deploy Web PWA

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'artifacts/hasahisawi/**'
      - '.github/workflows/deploy-web.yml'
      - '.web-deploy-trigger'
      - '.web-release-trigger'

permissions:
  contents: write
  pages: write
  deployments: write

jobs:
  deploy:
    name: Build and publish web PWA
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare web env
        run: |
          node <<'NODE'
          const fs = require('fs');
          const easJsonPath = 'artifacts/hasahisawi/eas.json';
          const eas = fs.existsSync(easJsonPath) ? JSON.parse(fs.readFileSync(easJsonPath, 'utf8')) : {};
          const env = eas.build?.production?.env || eas.build?.preview?.env || {};
          const fallback = {
            EXPO_PUBLIC_API_URL: 'https://api-server-gilt-ten.vercel.app',
            EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: 'hasahisawi.firebaseapp.com',
            EXPO_PUBLIC_FIREBASE_PROJECT_ID: 'hasahisawi',
            EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: 'hasahisawi.firebasestorage.app',
            EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '133656291161',
            EXPO_PUBLIC_FIREBASE_APP_ID: '1:133656291161:web:7d0a88a80d3be1af418e48'
          };
          const merged = { ...fallback, ...env };
          fs.writeFileSync('artifacts/hasahisawi/.env', Object.entries(merged).map(([k,v]) => `${k}=${v}`).join('\n') + '\n');
          console.log(`Prepared ${Object.keys(merged).length} env values`);
          NODE

      - name: Apply latest app patches
        working-directory: artifacts/hasahisawi
        run: |
          node scripts/apply-latest-sections.mjs || true
          node scripts/apply-driver-inbox-lite.mjs || true
          node scripts/apply-women-label-cleanup.mjs || true
          node scripts/apply-social-multi-images.mjs || true

      - name: Build GitHub Pages export under /hasahisawi
        run: |
          node <<'NODE'
          const fs = require('fs');
          const appJsonPath = 'artifacts/hasahisawi/app.json';
          const app = JSON.parse(fs.readFileSync(appJsonPath, 'utf8'));
          app.expo.experiments = app.expo.experiments || {};
          app.expo.experiments.baseUrl = '/hasahisawi';
          app.expo.web = app.expo.web || {};
          app.expo.web.scope = '/hasahisawi/';
          app.expo.web.startUrl = '/hasahisawi/';
          fs.writeFileSync(appJsonPath, JSON.stringify(app, null, 2) + '\n');
          NODE
          rm -rf artifacts/hasahisawi/dist docs
          pnpm --dir artifacts/hasahisawi exec expo export --platform web
          mkdir -p docs
          cp -r artifacts/hasahisawi/dist/. docs/
          cp -r artifacts/hasahisawi/public/splash docs/splash 2>/dev/null || true
          cp artifacts/hasahisawi/public/sw.js docs/sw.js 2>/dev/null || true
          cp artifacts/hasahisawi/public/manifest.json docs/manifest.json 2>/dev/null || true
          cp artifacts/hasahisawi/public/icon.png docs/icon.png 2>/dev/null || true
          cp artifacts/hasahisawi/public/favicon.png docs/favicon.png 2>/dev/null || true
          cp docs/index.html docs/404.html
          touch docs/.nojekyll

      - name: Fix GitHub Pages base paths
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = '/hasahisawi';
          for (const file of ['docs/index.html', 'docs/404.html']) {
            let html = fs.readFileSync(file, 'utf8');
            html = html
              .replaceAll('href="/_expo/', `href="${base}/_expo/`)
              .replaceAll('src="/_expo/', `src="${base}/_expo/`)
              .replaceAll('href="/assets/', `href="${base}/assets/`)
              .replaceAll('src="/assets/', `src="${base}/assets/`)
              .replaceAll('href="/splash/', `href="${base}/splash/`)
              .replaceAll('src="/splash/', `src="${base}/splash/`)
              .replaceAll('href="/manifest.json"', `href="${base}/manifest.json"`)
              .replaceAll('href="/favicon.png"', `href="${base}/favicon.png"`)
              .replaceAll("register('/sw.js')", `register('${base}/sw.js')`)
              .replaceAll('url(/assets/', `url(${base}/assets/`)
              .replaceAll('url("/assets/', `url("${base}/assets/`)
              .replaceAll("url('/assets/", `url('${base}/assets/`);
            if (!html.includes(`${base}/_expo/`) && !html.includes(`${base}/assets/`)) {
              throw new Error(`${file} did not receive GitHub Pages base paths`);
            }
            fs.writeFileSync(file, html);
          }
          if (fs.existsSync('docs/manifest.json')) {
            const manifest = JSON.parse(fs.readFileSync('docs/manifest.json', 'utf8'));
            manifest.start_url = `${base}/`;
            manifest.scope = `${base}/`;
            if (manifest.icons) {
              manifest.icons = manifest.icons.map(icon => ({
                ...icon,
                src: String(icon.src || '').startsWith('/') ? `${base}${icon.src}` : icon.src,
              }));
            }
            fs.writeFileSync('docs/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          }
          NODE

      - name: Write deploy metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('artifacts/hasahisawi/app.json', 'utf8'));
          fs.writeFileSync('docs/deploy-version.json', JSON.stringify({
            app: 'hasahisawi',
            version: app.expo.version,
            androidVersionCode: app.expo.android.versionCode,
            iosBuildNumber: app.expo.ios.buildNumber,
            commit: process.env.GITHUB_SHA,
            deployedAt: new Date().toISOString(),
            target: 'github-pages',
            source: 'deploy-web'
          }, null, 2) + '\n');
          NODE

      - name: Commit docs for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/
          if git diff --cached --quiet; then
            echo "No docs changes"
          else
            git commit -m "deploy: web PWA docs latest [auto]"
            git pull --rebase origin master || true
            git push origin master
          fi

      - name: Build Cloudflare root export
        run: |
          git checkout -- artifacts/hasahisawi/app.json
          rm -rf artifacts/hasahisawi/dist cf-dist
          node <<'NODE'
          const fs = require('fs');
          const appJsonPath = 'artifacts/hasahisawi/app.json';
          const app = JSON.parse(fs.readFileSync(appJsonPath, 'utf8'));
          app.expo.experiments = app.expo.experiments || {};
          app.expo.experiments.baseUrl = '';
          app.expo.web = app.expo.web || {};
          app.expo.web.scope = '/';
          app.expo.web.startUrl = '/';
          fs.writeFileSync(appJsonPath, JSON.stringify(app, null, 2) + '\n');
          NODE
          pnpm --dir artifacts/hasahisawi exec expo export --platform web
          mkdir -p cf-dist
          cp -r artifacts/hasahisawi/dist/. cf-dist/
          cp -r artifacts/hasahisawi/public/splash cf-dist/splash 2>/dev/null || true
          cp artifacts/hasahisawi/public/sw.js cf-dist/sw.js 2>/dev/null || true
          cp artifacts/hasahisawi/public/manifest.json cf-dist/manifest.json 2>/dev/null || true
          cp artifacts/hasahisawi/public/icon.png cf-dist/icon.png 2>/dev/null || true
          cp artifacts/hasahisawi/public/favicon.png cf-dist/favicon.png 2>/dev/null || true
          cp cf-dist/index.html cf-dist/404.html
          echo '/hasahisawi/* /:splat 302' > cf-dist/_redirects
          echo '/hasahisawi / 302' >> cf-dist/_redirects
          echo '/* /index.html 200' >> cf-dist/_redirects
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('artifacts/hasahisawi/app.json', 'utf8'));
          fs.writeFileSync('cf-dist/deploy-version.json', JSON.stringify({
            app: 'hasahisawi',
            version: app.expo.version,
            androidVersionCode: app.expo.android.versionCode,
            iosBuildNumber: app.expo.ios.buildNumber,
            commit: process.env.GITHUB_SHA,
            deployedAt: new Date().toISOString(),
            target: 'cloudflare-pages',
            source: 'deploy-web'
          }, null, 2) + '\n');
          NODE

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not configured — skipped Cloudflare deploy"
            exit 0
          fi
          npx wrangler@3 pages deploy cf-dist --project-name=hasahisawi --branch=master

      - run: |
          echo "GitHub Pages: https://almhbob.github.io/hasahisawi/"
          echo "Cloudflare Pages: https://hasahisawi.pages.dev/"
